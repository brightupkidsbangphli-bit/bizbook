<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BizBook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>BizBook บัญชีกิจการ</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --pri:#2563EB; --pri-d:#1D4ED8; --pri-l:#EAF1FF;
  --ink:#1F2430; --ink2:#5B6272; --line:#E6E8EE; --bg:#F6F7FA; --card:#fff;
  --ok:#16915A; --ok-l:#E3F6EC; --bad:#D64545; --bad-l:#FDECEC; --warn:#B7791F; --warn-l:#FFF6E0;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,sans-serif;font-size:15px}
h1,h2,h3{font-family:Prompt,Sarabun,sans-serif;font-weight:600;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.app{display:flex;min-height:100vh}
nav.side{width:232px;background:#fff;border-right:1px solid var(--line);padding:16px 12px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.co{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;cursor:pointer;display:flex;align-items:center;gap:10px}
.co:hover{background:var(--bg)}
.co .av{width:34px;height:34px;border-radius:9px;background:var(--pri);color:#fff;display:grid;place-items:center;font-family:Prompt;flex-shrink:0}
.co b{display:block;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.co small{color:var(--ink2);font-size:12px}
nav.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--ink2);text-decoration:none;font-weight:500;margin-bottom:2px}
nav.side a:hover{background:var(--bg)}
nav.side a.on{background:var(--pri-l);color:var(--pri-d)}
nav.side .sec{font-size:11px;color:#9AA0AD;margin:12px 12px 4px;letter-spacing:.3px}
nav.side svg{width:18px;height:18px;flex-shrink:0}
main{flex:1;min-width:0;padding:22px 28px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:22px}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .lbl{color:var(--ink2);font-size:13px}
.kpi .val{font-family:Prompt;font-size:23px;margin-top:4px}
.kpi .sub{font-size:12px;color:var(--ink2);margin-top:2px}
.two{grid-template-columns:2fr 1fr;margin-top:14px}
@media(max-width:1000px){.two{grid-template-columns:1fr}}
.card h3{font-size:15px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--ink2);font-weight:600;background:#FAFBFD}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:#FAFBFF}
tr.tot td{font-weight:700;background:#FAFBFD}
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.paid,.tag.accepted{background:var(--ok-l);color:var(--ok)}
.tag.unpaid,.tag.open{background:var(--warn-l);color:var(--warn)}
.tag.over,.tag.rejected{background:var(--bad-l);color:var(--bad)}
.tag.void,.tag.converted{background:#EEF0F4;color:var(--ink2)}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--ink2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--pri-d);border-color:var(--pri)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.empty{padding:36px;text-align:center;color:var(--ink2)}
.muted{color:var(--ink2)}
.ov{position:fixed;inset:0;background:rgba(20,24,35,.45);display:none;align-items:flex-start;justify-content:center;padding:36px 14px;overflow:auto;z-index:20}
.ov.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal.wide{max-width:900px}
.modal h2{font-size:18px;margin-bottom:14px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f .full{grid-column:1/-1}
.f label{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px;font-weight:500}
.f input,.f select,.f textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--pri-l);border-color:var(--pri)}
.f .chk{display:flex;align-items:center;gap:8px;padding-top:24px}
.f .chk input{width:auto}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.acts .l{margin-right:auto}
.items td{padding:5px 4px}
.items input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px}
.totbox{margin-left:auto;width:290px;margin-top:10px}
.totbox div{display:flex;justify-content:space-between;align-items:center;padding:3px 0;gap:8px}
.totbox .g{font-weight:700;font-size:17px;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:40}
.toast.show{opacity:1}
.doc{border:1px solid var(--line);border-radius:10px;padding:28px;background:#fff;font-size:14px}
.doc .hd{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--pri);padding-bottom:14px;margin-bottom:14px}
.doc .ttl{font-family:Prompt;font-size:20px;color:var(--pri-d);text-align:right}
.doc table th{background:var(--pri-l);color:var(--ink)}
.doc .sign{display:flex;justify-content:space-between;margin-top:46px;text-align:center}
.doc .sign div{width:40%;border-top:1px solid var(--ink2);padding-top:6px;font-size:13px;color:var(--ink2)}
.bars{display:flex;align-items:flex-end;gap:14px;height:180px;padding-top:10px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars .b{width:42%;max-width:26px;border-radius:4px 4px 0 0;min-height:2px}
.bars .lb{font-size:12px;color:var(--ink2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:4px}
.hbar span{display:block;height:100%;background:var(--pri)}
.colist .it{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.colist .it:hover{background:var(--bg)}
.colist .it.on{border-color:var(--pri);background:var(--pri-l)}

.att-wrap{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#FCFCFE}
.att-h{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.att-list{display:flex;flex-direction:column;gap:4px}
.att-it{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:7px;background:#fff;border:1px solid #EEF0F4}
.att-it a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-ic{font-size:10px;font-weight:700;background:var(--pri-l);color:var(--pri-d);border-radius:5px;padding:2px 5px;min-width:34px;text-align:center}
.sm-sel{padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff}
.pv-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pv-parts{display:inline-flex;gap:10px;flex-wrap:wrap;font-size:13px;background:var(--bg);padding:5px 10px;border-radius:8px}
.pv-parts label{display:flex;gap:4px;align-items:center;cursor:pointer}
.modal.wide{max-width:960px}
.pd-wrap{background:#E9ECF2;padding:16px;border-radius:10px;overflow:auto}
.pd{background:#fff;width:794px;min-height:1080px;margin:0 auto;padding:46px 50px;font-size:13px;color:#2A2F3A;box-shadow:0 2px 12px rgba(0,0,0,.07);line-height:1.5;display:flex;flex-direction:column}
.pd-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:22px}
.pd-co{display:flex;gap:14px;max-width:60%}
.pd-logo{max-height:64px;max-width:120px;object-fit:contain}
.pd-coname{font-family:Prompt;font-size:15.5px;font-weight:600;color:#1F2430}
.pd-small{font-size:11.5px;color:#6B7280}
.pd-ttl{text-align:right;min-width:200px}
.pd-title{font-family:Prompt;font-size:22px;font-weight:600;color:#1F2430;line-height:1.25}
.pd-title:after{content:'';display:block;width:44px;height:3px;background:var(--pri);border-radius:2px;margin:8px 0 4px auto}
.pd-en{font-size:11px;color:#9CA3AF;letter-spacing:.6px;text-transform:uppercase}
.pd-badge{display:inline-block;background:#F1F3F7;color:#6B7280;border-radius:99px;padding:1px 12px;font-size:11px;font-weight:600;margin-bottom:8px;letter-spacing:.3px}
.pd-info{display:grid;grid-template-columns:1.55fr 1fr;gap:12px;margin-bottom:18px}
.pd-box{background:#F7F8FB;border-radius:8px;padding:10px 14px}
.pd-lbl{font-size:10.5px;color:#9CA3AF;margin-bottom:2px;letter-spacing:.3px}
.pd-pname{font-weight:700;font-size:14px;color:#1F2430}
.pd-meta div{display:flex;justify-content:space-between;gap:8px;padding:1.5px 0}
.pd-meta span{color:#6B7280}
.pd-tbl{width:100%;border-collapse:collapse}
.pd-tbl th{background:none;color:#6B7280;font-size:11.5px;font-weight:600;padding:8px 8px;border-bottom:2px solid var(--pri);text-align:left}
.pd-tbl th.num{text-align:right}
.pd-tbl td{padding:9px 8px;border-bottom:1px solid #EEF0F4;vertical-align:top}
.pd-tbl tr.tot td{border-top:1.5px solid #CBD2DE;font-weight:700;border-bottom:none}
.pd-sum{display:flex;gap:24px;margin-top:14px;align-items:flex-start}
.pd-left{flex:1;font-size:12.5px;color:#4B5563}
.pd-tot{width:290px}
.pd-tot div{display:flex;justify-content:space-between;padding:4px 12px}
.pd-tot .g{background:var(--pri);color:#fff;font-weight:700;font-size:14.5px;border-radius:8px;padding:9px 12px;margin-top:6px}
.pd-baht{margin-top:8px;text-align:right;font-size:12px;color:#4B5563}
.pd-note{margin-top:14px;background:#F7F8FB;border-radius:8px;padding:8px 14px;font-size:12.5px;color:#374151}
.pd-note .pd-lbl{font-size:11px;margin-bottom:4px}
.pd-foot{margin-top:18px;text-align:center;font-size:12px;color:#6B7280;white-space:pre-line}
.pd-reason{margin-bottom:10px;background:#F7F8FB;border-radius:8px;padding:8px 14px}
.pd-sign{display:flex;justify-content:space-between;gap:24px;margin-top:auto;padding-top:56px;text-align:center;font-size:12.5px}
.pd-sign>div{flex:1;max-width:210px}
.pd-sigimg{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);max-height:54px;max-width:170px;object-fit:contain}
.pd-stamp{position:absolute;right:-18px;bottom:-22px;transform:rotate(-8deg);max-height:82px;max-width:100px;opacity:.85;object-fit:contain}
.sig-th{width:90px;height:40px;border:1px solid var(--line);border-radius:6px;background:#fff;display:grid;place-items:center;flex-shrink:0}.sig-th img{max-width:84px;max-height:34px;object-fit:contain}
.pd-line{position:relative;border-bottom:1px solid #9CA3AF;height:38px;margin-bottom:6px}
.pd-itimg{width:56px;height:56px;object-fit:cover;border-radius:6px;flex-shrink:0}
.pd-gal{margin-top:16px;page-break-inside:avoid}
.pd-gal>div:last-child{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.pd-gal img{max-width:220px;max-height:170px;object-fit:contain;border-radius:6px;background:#F7F8FB}
.rp-head{text-align:center;margin-bottom:14px}
table.rp td,table.rp th{padding:6px 10px}
table.rp tr.sec td{font-weight:700;background:#FAFBFD;padding-top:12px}
table.rp tr.sub td{font-weight:600;padding-left:14px}
table.rp tr.tot td{font-weight:700;border-top:1px solid #CBD2DE}
table.rp tr.grand td{font-weight:700;border-top:2px solid var(--ink);border-bottom:3px double var(--ink);background:#FAFBFD}
table.rp tr.jr-h td{background:#FAFBFD;border-top:1px solid #DDE2EA}
.thumb{position:relative;display:inline-block;flex-shrink:0}.thumb img{width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}.thumb.lg img{width:84px;height:84px}
.thumb b{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:grid;place-items:center;cursor:pointer}
.img-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;align-items:center}
.img-add{display:inline-grid;place-items:center;width:84px;height:84px;border:1.5px dashed #C3CAD6;border-radius:8px;color:var(--ink2);font-size:12px;cursor:pointer;text-align:center}
.img-add:hover{border-color:var(--pri);color:var(--pri)}
textarea#d_note{width:100%;min-height:150px;font-size:14px;line-height:1.6;resize:vertical;padding:10px 12px}
textarea.subdesc{width:100%;margin-top:4px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-size:13px;resize:vertical;color:var(--ink2)}
@page{size:A4;margin:0}
@media print{
  body.printing *{visibility:hidden}
  body.printing #docEl,body.printing #docEl *{visibility:visible}
  body.printing #docEl{position:absolute;left:0;top:0;box-shadow:none;width:210mm;min-height:297mm;padding:13mm 14mm}
  body.printing .ov{position:static;background:none;padding:0}
  body.printing .pd-wrap{background:none;padding:0}
}
.pd-e{display:block;font-size:.8em;color:#6b7280;font-weight:400;line-height:1.2;letter-spacing:0}.pd-e1{font-size:.85em;color:#6b7280;font-weight:400}.pd-tbl th .pd-e{color:inherit;opacity:.75}.pd-sum .g .pd-e1,.pd-badge .pd-e1{color:inherit;opacity:.8}
body:has(#updBar){padding-top:44px}
/* ---- BizBook มือถือ ---- */
#gsetup{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top))}
#gsetup .gbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 20px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px;text-align:center}
#gsetup .glogo{width:56px;height:56px;border-radius:14px;background:var(--pri);color:#fff;font-family:Prompt;font-size:28px;display:grid;place-items:center;margin:0 auto 4px}
#gsetup h2{font-size:20px}
#gsetup p{margin:0;color:var(--ink2);line-height:1.5}
#gsetup input{padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;width:100%}
#gsetup .btn{justify-content:center;padding:12px;font-size:16px}
#gsetup .gerr{color:var(--bad)}
#gsetup .gnote{font-size:12px;text-align:left;margin-top:6px}
#gsetup code{font-size:12px;word-break:break-all;background:var(--bg);padding:1px 4px;border-radius:4px}
#gsetup .glist{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow:auto;text-align:left}
#gsetup .gfile{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer}
#gsetup .gfile b{display:block;word-break:break-all}#gsetup .gfile small{color:var(--ink2)}
.gdrv{margin-top:auto;padding:10px 12px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
.gdrv .gf{display:flex;align-items:center;gap:6px;word-break:break-all}
#gdot{width:9px;height:9px;border-radius:50%;background:#C5CAD3;flex-shrink:0}#gdot[data-st=ok]{background:var(--ok)}#gdot[data-st=busy]{background:var(--warn)}#gdot[data-st=off]{background:var(--bad)}
.gdrv .gb{display:flex;gap:6px;flex-wrap:wrap}
#mnav{display:none}
@media (max-width:820px){
  html,body{font-size:15px;-webkit-text-size-adjust:100%}
  input,select,textarea{font-size:16px!important}
  .app{display:block}
  nav.side{position:fixed;left:0;top:0;bottom:0;height:100%;z-index:35;width:270px;transform:translateX(-105%);transition:transform .22s;box-shadow:0 0 40px rgba(0,0,0,.18);padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  body.navopen nav.side{transform:none}
  #navmask{position:fixed;inset:0;background:rgba(20,24,35,.35);z-index:34;display:none}
  body.navopen #navmask{display:block}
  main{padding:0 12px calc(70px + env(safe-area-inset-bottom))}
  .top{position:sticky;top:0;z-index:15;background:var(--bg);margin:0 -12px 12px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;flex-wrap:nowrap;align-items:flex-start;border-bottom:1px solid var(--line)}
  #mnav{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;flex-shrink:0;font-size:20px;cursor:pointer}
  .top h1{font-size:18px;flex:1;min-width:0;padding-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #topAct{flex-wrap:wrap;justify-content:flex-end;gap:6px!important;max-width:62%}
  #topAct .btn{padding:7px 10px;font-size:13px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .kpi .val{font-size:19px}
  .card{padding:12px}
  .tablewrap{-webkit-overflow-scrolling:touch}
  .tablewrap table{min-width:620px}
  .f{grid-template-columns:1fr!important}
  .f>*{grid-column:auto!important}
  .ov{padding:0;align-items:flex-start;background:#fff}
  .modal,.modal.wide{max-width:none!important;border-radius:0;min-height:100%;padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));box-shadow:none}
  .itemsx{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
  .itemsx table.items{min-width:660px}
  .acts{position:sticky;bottom:0;background:#fff;padding:10px 0 calc(6px + env(safe-area-inset-bottom));margin-top:14px;border-top:1px solid var(--line)}
  .acts .btn{padding:9px 11px;font-size:14px}
  .pd-wrap{padding:6px;overflow:hidden}
  .pv-bar{position:sticky;top:calc(-14px - env(safe-area-inset-top));z-index:5;background:#fff;padding:8px 0}
  .toast{bottom:calc(24px + env(safe-area-inset-bottom));max-width:92vw}
}
@media print{#mnav,#navmask,#gsetup,.gdrv{display:none!important}.pd{zoom:1!important}}

</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <main>
    <div class="top"><h1 id="title"></h1><div id="topAct" style="display:flex;gap:8px"></div></div>
    <div id="view"></div>
  </main>
</div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>window.BB_MOBILE_VER="1.0.1"</script>

<script>
/* BizBook มือถือ — เก็บข้อมูลในไฟล์เดียวกับโปรแกรมบนคอม ผ่าน Google Drive
   ข้อมูลบนเครื่องเก็บสำเนาไว้ใน IndexedDB เสมอ (ปิดแอป/หมดเวลาเข้าสู่ระบบ ข้อมูลไม่หาย) */
(function(){
const SCOPE='https://www.googleapis.com/auth/drive';
const LS={get:k=>{try{return localStorage.getItem('bbm_'+k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem('bbm_'+k):localStorage.setItem('bbm_'+k,v)}catch(e){}}};
/* ---- IndexedDB ---- */
let dbp;function idb(){return dbp||(dbp=new Promise((ok,no)=>{const r=indexedDB.open('bizbook-m',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))}
async function iget(k){const d=await idb();return new Promise(ok=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result==null?null:q.result);q.onerror=()=>ok(null)})}
async function iset(k,v){const d=await idb();return new Promise(ok=>{const t=d.transaction('kv','readwrite');v==null?t.objectStore('kv').delete(k):t.objectStore('kv').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>ok()})}
/* ---- merge 3 ทาง (เหมือนโปรแกรมบนคอม) ---- */
const same=(a,b)=>a===b||JSON.stringify(a)===JSON.stringify(b),isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
function merge3(base,mine,theirs){if(same(mine,theirs))return mine;if(same(mine,base))return theirs;if(same(theirs,base))return mine;
  if(isObj(mine)&&isObj(theirs)){const b=isObj(base)?base:{},out={};new Set([...Object.keys(mine),...Object.keys(theirs)]).forEach(k=>{const v=merge3(b[k],mine[k],theirs[k]);if(v!==undefined)out[k]=v});return out}
  return mine===undefined?theirs:mine}
const nCo=s=>{try{return Object.keys(JSON.parse(s).companies||{}).length}catch(e){return -1}};
/* ---- เข้าสู่ระบบ Google (redirect เหมาะกับแอปบนหน้าจอโฮมของมือถือ) ---- */
const here=()=>location.origin+location.pathname;
function authUrl(silent){const st=Math.random().toString(36).slice(2);LS.set('state',st);
  const p=new URLSearchParams({client_id:LS.get('cid'),redirect_uri:here(),response_type:'token',scope:SCOPE,include_granted_scopes:'true',state:st,prompt:silent?'none':'select_account'});
  const h=LS.get('hint');if(h)p.set('login_hint',h);return 'https://accounts.google.com/o/oauth2/v2/auth?'+p}
function signIn(silent){location.href=authUrl(silent)}
let authErr=null;
(function readHash(){if(!/access_token=|error=/.test(location.hash))return;const p=new URLSearchParams(location.hash.slice(1));history.replaceState(null,'',here());
  if(p.get('state')!==LS.get('state')){authErr='การเข้าสู่ระบบไม่ถูกต้อง ลองใหม่อีกครั้ง';return}
  if(p.get('error')){authErr=p.get('error')==='interaction_required'||p.get('error')==='login_required'?null:'เข้าสู่ระบบไม่สำเร็จ ('+p.get('error')+')';LS.set('tok',null);return}
  LS.set('tok',p.get('access_token'));LS.set('exp',String(Date.now()+(+p.get('expires_in')||3600)*1000-60000))})();
const tokOk=()=>LS.get('tok')&&+LS.get('exp')>Date.now();
class AuthNeeded extends Error{}
async function api(url,opt={}){if(!tokOk())throw new AuthNeeded('หมดเวลาเข้าสู่ระบบ');
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+LS.get('tok')}});
  if(r.status===401){LS.set('tok',null);throw new AuthNeeded('หมดเวลาเข้าสู่ระบบ')}
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error('Google Drive ตอบกลับผิดพลาด ('+r.status+') '+m)}
  return r}
const DRV='https://www.googleapis.com/drive/v3/files';
const meta=fid=>api(`${DRV}/${fid}?fields=id,name,version,modifiedTime&supportsAllDrives=true`).then(r=>r.json());
const getText=fid=>api(`${DRV}/${fid}?alt=media&supportsAllDrives=true`,{cache:'no-store'}).then(r=>r.text());
async function upload(fid,s){const r=await api(`https://www.googleapis.com/upload/drive/v3/files/${fid}?uploadType=media&fields=version&supportsAllDrives=true`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:s});return (await r.json()).version}
/* ---- สถานะซิงค์ ---- */
let baseRaw=null,baseVer=null,remoteRaw=null,busy=Promise.resolve(),lastErr=null;
function stamp(s){try{const j=JSON.parse(s);const pv=(j._meta&&j._meta.ver)||'0';j._meta={ver:pv,by:'mobile',host:(navigator.userAgent.match(/iPhone|iPad|Android/)||['มือถือ'])[0],at:new Date().toISOString()};return JSON.stringify(j)}catch(e){return s}}
function setDot(st){const d=document.getElementById('gdot');if(d){d.dataset.st=st;d.title={ok:'ซิงค์กับ Google Drive แล้ว',busy:'กำลังซิงค์…',off:'ยังไม่ได้ซิงค์ — ข้อมูลเก็บไว้ในเครื่องก่อน'}[st]||''}}
async function syncCore(local){const fid=LS.get('fid');setDot('busy');
  try{const m=await meta(fid);let out=local!=null?local:baseRaw,changed=false,needUp;
    if(m.version===baseVer&&baseRaw!=null){needUp=out!==baseRaw}
    else{const remote=await getText(fid);
      if(remoteRaw!=null&&remote===remoteRaw){needUp=out!==baseRaw}
      else{let theirs;try{theirs=JSON.parse(remote)}catch(e){setDot('off');return null}/* ไฟล์ยังซิงค์ไม่ครบ ลองใหม่รอบหน้า */
        if(local==null){out=remote;changed=true}
        else{const mine=JSON.parse(local),base=JSON.parse(baseRaw||'{}');const mg=merge3(base,mine,theirs);
          mg.current=mine.current&&mg.companies&&mg.companies[mine.current]?mine.current:(theirs.current||mine.current);out=JSON.stringify(mg);changed=out!==local}
        remoteRaw=remote;baseVer=m.version;needUp=out!==remote&&!same(JSON.parse(out),theirs)}}
    if(needUp){if(nCo(out)===0&&nCo(remoteRaw||baseRaw)>0)throw new Error('ไม่บันทึกข้อมูลว่างทับไฟล์ที่มีข้อมูลอยู่');const st=stamp(out);baseVer=await upload(fid,st);remoteRaw=st}
    baseRaw=out;await iset('base',out);await iset('local',out);lastErr=null;setDot('ok');return {raw:out,changed}}
  catch(e){setDot('off');if(e instanceof AuthNeeded){reauth();return null}lastErr=e;throw e}}
function sync(local){const p=busy.then(()=>syncCore(local));busy=p.catch(()=>{});return p}
let reauthT=null;function reauth(){if(reauthT)return;reauthT=setTimeout(()=>{if(document.visibilityState==='visible'&&LS.get('cid')&&LS.get('fid'))signIn(true)},400)}
/* ---- หน้าตั้งค่าครั้งแรก ---- */
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function gate(html){let g=document.getElementById('gsetup');if(!g){g=document.createElement('div');g.id='gsetup';document.body.appendChild(g)}g.innerHTML=`<div class="gbox"><div class="glogo">B</div><h2>BizBook มือถือ</h2>${html}</div>`;g.style.display='flex';return g}
const gateClose=()=>{const g=document.getElementById('gsetup');if(g)g.style.display='none'};
function askCid(msg){gate(`<p>ใส่ <b>Client ID</b> ที่ได้จาก Google Cloud Console (ลงท้ายด้วย .apps.googleusercontent.com)</p>${msg?`<p class="gerr">${esc(msg)}</p>`:''}
  <input id="g_cid" placeholder="xxxx.apps.googleusercontent.com" value="${esc(LS.get('cid')||'')}" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button class="btn pri" id="g_go">เข้าสู่ระบบ Google</button>
  <p class="gnote">ที่อยู่ของแอปนี้ (ใส่ในช่อง Authorized JavaScript origins และ Authorized redirect URIs):<br><code>${esc(location.origin)}</code><br><code>${esc(here())}</code></p>`);
  document.getElementById('g_go').onclick=()=>{const v=document.getElementById('g_cid').value.trim();if(!/\.apps\.googleusercontent\.com$/.test(v))return askCid('Client ID ไม่ถูกต้อง');LS.set('cid',v);signIn(false)}}
function askLogin(msg){gate(`<p>เข้าสู่ระบบบัญชี Google ที่เก็บไฟล์ข้อมูล BizBook</p>${msg?`<p class="gerr">${esc(msg)}</p>`:''}<button class="btn pri" id="g_go">เข้าสู่ระบบ Google</button><button class="btn" id="g_cid2" style="margin-top:8px">เปลี่ยน Client ID</button>`);
  document.getElementById('g_go').onclick=()=>signIn(false);document.getElementById('g_cid2').onclick=()=>askCid()}
async function pickFile(done){gate(`<p>กำลังค้นหาไฟล์ข้อมูลใน Google Drive…</p>`);let fs=[];
  try{const q=encodeURIComponent("trashed=false and (mimeType='application/json' or name contains '.json')");
    const r=await api(`${DRV}?q=${q}&orderBy=modifiedTime desc&pageSize=50&fields=files(id,name,modifiedTime,size)&includeItemsFromAllDrives=true&supportsAllDrives=true`).then(r=>r.json());
    fs=(r.files||[]).filter(f=>!/backup|hourly|bizbook-\d{4}-/i.test(f.name)||/BizBook-/i.test(f.name))}
  catch(e){if(e instanceof AuthNeeded)return askLogin();return gate(`<p class="gerr">${esc(e.message)}</p><button class="btn pri" onclick="location.reload()">ลองใหม่</button>`)}
  const fmt=t=>new Date(t).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});
  gate(`<p>เลือกไฟล์ข้อมูลที่ใช้ร่วมกับโปรแกรมบนคอม</p><div class="glist">${fs.length?fs.map(f=>`<button class="gfile" data-id="${esc(f.id)}" data-n="${esc(f.name)}"><b>${esc(f.name)}</b><small>แก้ไขล่าสุด ${fmt(f.modifiedTime)} · ${Math.max(1,Math.round((+f.size||0)/1024))} KB</small></button>`).join(''):'<p class="gerr">ไม่พบไฟล์ .json ใน Google Drive<br>ให้ย้ายไฟล์ข้อมูลไป Google Drive จากโปรแกรมบนคอมก่อน</p>'}</div>
    <button class="btn" onclick="location.reload()">ค้นหาใหม่</button>`);
  document.querySelectorAll('.gfile').forEach(b=>b.onclick=()=>{LS.set('fid',b.dataset.id);LS.set('fname',b.dataset.n);baseRaw=null;baseVer=null;iset('base',null).then(()=>iset('local',null)).then(done)})}
async function hint(){try{const r=await api('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)').then(r=>r.json());const e=r.user&&r.user.emailAddress;if(e)LS.set('hint',e)}catch(e){}}
/* ---- โหลดครั้งแรก ---- */
function load(){return new Promise(resolve=>{
  const go=async()=>{
    if(!LS.get('cid'))return askCid();
    if(!tokOk()){const local=await iget('local');if(local&&LS.get('fid')&&!authErr&&!LS.get('silentTried')){LS.set('silentTried','1');return signIn(true)}
      LS.set('silentTried',null);
      if(local&&LS.get('fid')){/* ใช้ข้อมูลในเครื่องไปก่อน แล้วค่อยเข้าสู่ระบบ */window.__bbOffline=true;setTimeout(()=>setDot('off'),500);return resolve(local)}
      return askLogin(authErr)}
    LS.set('silentTried',null);if(!LS.get('hint'))hint();
    if(!LS.get('fid'))return pickFile(go);
    gate(`<p>กำลังเปิดข้อมูลจาก Google Drive…</p>`);
    const local=await iget('local'),base=await iget('base');
    baseRaw=base;baseVer=null;
    try{const r=await sync(local&&local!==base?local:null);gateClose();resolve(r?r.raw:local)}
    catch(e){gateClose();if(local){window.__bbOffline=true;resolve(local);setTimeout(()=>window.toast&&toast('ซิงค์ไม่สำเร็จ ใช้ข้อมูลในเครื่องไปก่อน: '+e.message),800)}
      else gate(`<p class="gerr">${esc(e.message)}</p><button class="btn pri" onclick="location.reload()">ลองใหม่</button><button class="btn" id="g_pick" style="margin-top:8px">เลือกไฟล์อื่น</button>`),document.getElementById('g_pick').onclick=()=>{LS.set('fid',null);location.reload()}}};
  go()})}
/* ---- ส่งไฟล์ออก (Excel / สำรองข้อมูล) — ใช้เมนูแชร์ของมือถือ ---- */
async function shareOrDownload(name,blob){const f=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return true}catch(e){if(e.name==='AbortError')return false}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),30000);return true}
async function saveXlsx(name,sheets){const wb=new ExcelJS.Workbook();wb.creator='BizBook';wb.created=new Date();
  for(const s of sheets){const ws=wb.addWorksheet(String(s.name).replace(/[\\/*?:\[\]]/g,' ').slice(0,31));
    (s.title||[]).forEach((t,i)=>{const r=ws.addRow([t]);r.font={bold:true,size:i===0?13:11}});if((s.title||[]).length)ws.addRow([]);
    const hr=ws.addRow(s.cols.map(c=>c.h));hr.eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF2563EB'}};c.alignment={vertical:'middle',wrapText:true}});
    ws.views=[{state:'frozen',ySplit:hr.number}];
    for(const row of s.rows){const bold=!Array.isArray(row),v=bold?row.v:row;
      const r=ws.addRow(s.cols.map((c,i)=>{const x=v[i];if(x===''||x==null)return null;if(c.t==='d'&&/^\d{4}-\d{2}-\d{2}$/.test(x)){const [y,mo,d]=x.split('-').map(Number);return new Date(Date.UTC(y,mo-1,d))}return x}));
      if(bold){r.font={bold:true};r.eachCell({includeEmpty:true},c=>{c.border={top:{style:'thin'}}})}}
    s.cols.forEach((c,i)=>{const col=ws.getColumn(i+1);col.width=c.w||14;if(c.t==='n'){col.numFmt='#,##0.00;[Red]-#,##0.00';col.alignment={horizontal:'right'}}if(c.t==='d')col.numFmt='dd/mm/yyyy'})}
  const buf=await wb.xlsx.writeBuffer();return shareOrDownload(name.replace(/[\\/:*?"<>|]+/g,' '),new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}
/* ---- bridge ที่โปรแกรมหลักใช้ ---- */
window.bridge={
  load,
  save:async s=>{await iset('local',s);if(window.__bbOffline&&!tokOk()){setDot('off');reauth();return true}const r=await sync(s);return r&&r.changed?{merged:r.raw}:true},
  saveSync:s=>{iset('local',s)},
  check:async s=>{if(s)await iset('local',s);if(!tokOk()){setDot('off');return null}const r=await sync(s);return r&&r.changed?{merged:r.raw}:null},
  onChanged:fn=>{setInterval(()=>{if(document.visibilityState==='visible'&&tokOk())fn()},25000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(!tokOk()&&LS.get('fid'))reauth();else fn()}})},
  saveFile:(name,data)=>shareOrDownload(name,new Blob([data],{type:'application/json'})),
  saveXlsx,
  version:async()=>window.BB_MOBILE_VER||'มือถือ'
};
window.gdrive={signIn,pickFile:()=>{LS.set('fid',null);location.reload()},signOut:()=>{LS.set('tok',null);LS.set('hint',null);location.reload()},file:()=>LS.get('fname'),status:()=>lastErr?lastErr.message:null,syncNow:()=>window.syncNow&&syncNow()};
})();

</script>
<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100+Number.EPSILON*100)/100;
const money=n=>(+n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>(+n||0).toLocaleString('th-TH',{maximumFractionDigits:0});
const mAcc=n=>{n=r2(n);return n<0?`(${money(-n)})`:money(n)};
const isoOf=d=>{d=new Date(d);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const today=()=>isoOf(new Date());
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoOf(d)};
const monthEnd=k=>{const [y,m]=k.split('-').map(Number);return isoOf(new Date(y,m,0))};
const addMonths=(k,n)=>{const [y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
const thDate=iso=>iso?new Date(iso+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'}):'-';
const ym=iso=>(iso||'').slice(0,7);
const thMonth=k=>{const [y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('th-TH',{month:'short',year:'2-digit'})};
const thMonthLong=k=>{const [y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('th-TH',{month:'long',year:'numeric'})};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const val=id=>{const e=$('#'+id);return e?e.value.trim():''};
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
function bahtText(num){
  num=r2(num);const d=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],p=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const rd=n=>{if(+n===0)return'';if(n.length>6)return rd(n.slice(0,-6))+'ล้าน'+rd(n.slice(-6));let s='';const L=n.length;
    for(let i=0;i<L;i++){const x=+n[i],pos=L-i-1;if(!x)continue;
      if(pos===0&&x===1&&L>1&&+n.slice(0,-1)>0)s+='เอ็ด';else if(pos===1&&x===2)s+='ยี่';else if(pos===1&&x===1)s+='';else s+=d[x];s+=p[pos]}return s};
  const [b,st]=num.toFixed(2).split('.');let out=+b?rd(String(+b))+'บาท':'';
  out+= +st?rd(String(+st))+'สตางค์':(+b?'ถ้วน':'ศูนย์บาทถ้วน');return out;
}

/* ================= chart of accounts ================= */
const TYPES={asset:'สินทรัพย์',liability:'หนี้สิน',equity:'ส่วนของเจ้าของ',revenue:'รายได้',expense:'ค่าใช้จ่าย'};
const DEF_COA=[
 ['1110','เงินสด','asset',{money:1}],['1120','เงินฝากธนาคาร','asset',{money:1}],
 ['1130','ลูกหนี้การค้า','asset',{sys:1}],['1140','สินค้าคงเหลือ','asset'],['1150','ค่าใช้จ่ายจ่ายล่วงหน้า','asset'],
 ['1160','เงินมัดจำจ่ายผู้ขาย','asset',{sys:1}],['1170','ภาษีซื้อ','asset',{sys:1}],['1175','ภาษีมูลค่าเพิ่มชำระเกิน (ยกไป / ขอคืน)','asset',{sys:1}],['1180','ภาษีเงินได้ถูกหัก ณ ที่จ่าย','asset',{sys:1}],['1190','สินทรัพย์หมุนเวียนอื่น','asset'],
 ['1510','อุปกรณ์และเครื่องใช้สำนักงาน','asset',{nc:1,contra:'1511',life:5}],['1511','ค่าเสื่อมราคาสะสม - อุปกรณ์สำนักงาน','asset',{nc:1,sys:1}],
 ['1520','เครื่องคอมพิวเตอร์','asset',{nc:1,contra:'1521',life:3}],['1521','ค่าเสื่อมราคาสะสม - คอมพิวเตอร์','asset',{nc:1,sys:1}],
 ['1530','ยานพาหนะ','asset',{nc:1,contra:'1531',life:5}],['1531','ค่าเสื่อมราคาสะสม - ยานพาหนะ','asset',{nc:1,sys:1}],
 ['1540','เครื่องจักรและอุปกรณ์','asset',{nc:1,contra:'1541',life:5}],['1541','ค่าเสื่อมราคาสะสม - เครื่องจักร','asset',{nc:1,sys:1}],

const NUM_TYPES=[['QT','ใบเสนอราคา'],['IV','ใบแจ้งหนี้ / ใบส่งของ / ใบกำกับภาษี'],['BN','ใบวางบิล'],['RE','ใบเสร็จรับเงิน'],['CN','ใบลดหนี้'],['DB','ใบเพิ่มหนี้'],['PO','ใบสั่งซื้อ'],['PV','ใบสำคัญจ่าย'],['EX','ค่าใช้จ่าย (จ่ายเงินสด)'],['PU','ซื้อเชื่อ'],['JV','สมุดรายวันทั่วไป']];
const defNumFmt=p=>p+'{YYYY}{MM}-{###}';

function expandFmt(fmt,iso){const d=new Date((iso||today())+'T00:00:00');const be=d.getFullYear()+543;
  let s=fmt.replace(/\{YYYY\}/g,be).replace(/\{YY\}/g,String(be%100).padStart(2,'0')).replace(/\{CE\}/g,d.getFullYear()).replace(/\{MM\}/g,String(d.getMonth()+1).padStart(2,'0'));
  const m=s.match(/\{(#+)\}/);if(!m)return [s,'',3];return [s.slice(0,m.index),s.slice(m.index+m[0].length),m[1].length]}

function nextNo(prefix,iso){
  const [pre,post,pad]=expandFmt(numFmt(prefix),iso);let max=0;

  const st=(C().org.numStart||{})[prefix];if(st&&st.key===pre+'|'+post&&st.n-1>max)max=st.n-1;
  return pre+String(max+1).padStart(pad,'0')+post;
}
/* เลขที่ที่ผู้ใช้พิมพ์เองในเอกสารใหม่ → ใช้เป็นรูปแบบของประเภทนั้น แล้วรันต่อจากเลขนี้ */
function noFitsFmt(p,no,iso){const [pre,post]=expandFmt(numFmt(p),iso);return no.startsWith(pre)&&no.endsWith(post)&&/^\d+$/.test(no.slice(pre.length,no.length-post.length))}
function deriveFmt(no,iso){const m=String(no).match(/^(.*?)(\d+)(\D*)$/);if(!m)return null;
  const d=new Date((iso||today())+'T00:00:00');const be=String(d.getFullYear()+543),ce=String(d.getFullYear()),mm=String(d.getMonth()+1).padStart(2,'0');
  let pre=m[1].replace(/[{}]/g,''),num=m[2],post=m[3].replace(/[{}]/g,'');
  // เลขรันติดกับปี/เดือนโดยไม่มีตัวคั่น เช่น QT2569110005 → แยกปี/เดือนออกมา
  for(const [y,tk] of [[be,'{YYYY}'],[ce,'{CE}']]){const k=num.indexOf(y);if(k===0&&num.length>y.length+2){const rest=num.slice(y.length);if(rest.startsWith(mm)&&rest.length>3){pre+=tk+'{MM}';num=rest.slice(2)}else{pre+=tk;num=rest}break}}
  pre=pre.replace(new RegExp(be+'([-/._ ]?)'+mm+'(?!\\d)'),'{YYYY}$1{MM}').replace(new RegExp(ce+'([-/._ ]?)'+mm+'(?!\\d)'),'{CE}$1{MM}');
  if(!/\{YYYY\}|\{CE\}/.test(pre))pre=pre.replace(new RegExp('(^|\\D)'+be+'(?!\\d)'),'$1{YYYY}').replace(new RegExp('(^|\\D)'+ce+'(?!\\d)'),'$1{CE}');
  return {fmt:pre+'{'+'#'.repeat(num.length)+'}'+post,n:+num}}
function learnNo(p,no,iso){if(!no||noFitsFmt(p,no,iso))return;const r=deriveFmt(no,iso);if(!r)return;

function rcCalc(r){
  if(r.dep){const c=depCalc(r);const wht=r2(c.base*(+r.wht||0)/100);return {gross:c.gross,base:c.base,wht,net:r2(c.gross-wht),vatPay:0,depVat:c.vat}}
  let gross=0,vatPay=0,base=0;
  (r.apply||[]).forEach(x=>{const iv=C().docs[x.docId];if(!iv)return;const s=splitApplied(iv,+x.amt||0);gross+=+x.amt||0;base+=s.base;if(iv.vat&&iv.taxPoint==='payment')vatPay+=s.vat});
  gross=r2(gross);base=r2(base);const wht=r2(base*(+r.wht||0)/100);return {gross,base,wht,net:r2(gross-wht),vatPay:r2(vatPay)};

function pvCalc(p){
  if(p.dep){const c=depCalc(p);const wht=r2(c.base*(+p.wht||0)/100);return {gross:c.gross,base:c.base,vat:c.vat,wht,net:r2(c.gross-wht)}}

    items.forEach((x,i)=>{const share=i===items.length-1?left:r2(c.base*x.amt/sub);left=r2(left-share);out.push(sgn>0?{acc:x.acc,dr:0,cr:share}:{acc:x.acc,dr:share,cr:0})});return out};

  list('expenses').forEach(e=>{

  // automatic month-end VAT closing (ภาษีขาย - ภาษีซื้อ -> ภ.พ.30)
  if(C().org.vatReg&&C().org.autoVat!==false){

    Object.entries(m).forEach(([k,x])=>{const end=monthEnd(k);if(end>=today())return;const out=r2(x.out),inp=r2(x.inp),net=r2(out-inp);if(!out&&!inp)return;
      add({date:end,no:'VAT'+k.replace('-',''),desc:'ปิดภาษีซื้อ-ภาษีขาย ภ.พ.30 '+thMonthLong(k),src:{t:'VAT',id:k},lines:[{acc:'2150',dr:out,cr:0},{acc:'1170',dr:0,cr:inp},net>=0?{acc:'2160',dr:0,cr:net}:{acc:'1175',dr:-net,cr:0}]})});
  }
  J.sort((a,b)=>a.date.localeCompare(b.date)||(a.no||'').localeCompare(b.no||''));
  JCACHE={rev:REV,co:DB.current,j:J};return J;
}
function assets(){
  return list('expenses').filter(e=>{const a=A(e.acc);return a.type==='asset'&&a.contra&&+e.life>0}).map(e=>{
    const cost=calcExp(e).base,months=Math.round(+e.life*12),mo=r2(cost/months);const start=ym(e.date);const sch=[];let acc=0;
    for(let i=0;i<months;i++){const k=addMonths(start,i);const amt=i===months-1?r2(cost-acc):mo;acc=r2(acc+amt);sch.push({date:monthEnd(k),amt})}
    return {id:e.id,name:e.desc||A(e.acc).name,acc:e.acc,contra:A(e.acc).contra,date:e.date,cost,life:+e.life,schedule:sch};
  });
}
const sign=t=>(t==='asset'||t==='expense')?1:-1;
function balances(from,to){
  const b={};journal().forEach(e=>{if((from&&e.date<from)||(to&&e.date>to))return;e.lines.forEach(l=>{const x=b[l.acc]||(b[l.acc]={dr:0,cr:0});x.dr+=l.dr;x.cr+=l.cr})});
  Object.entries(b).forEach(([k,x])=>{x.dr=r2(x.dr);x.cr=r2(x.cr);x.bal=r2((x.dr-x.cr)*sign(A(k).type))});return b;
}
const balOf=(code,to)=>(balances(null,to)[code]||{bal:0}).bal;
function pl(from,to){const b=balances(from,to);let rev=0,exp=0;Object.entries(b).forEach(([k,x])=>{const t=A(k).type;if(t==='revenue')rev+=x.bal;if(t==='expense')exp+=x.bal});return {rev:r2(rev),exp:r2(exp),net:r2(rev-exp),b}}

/* ================= recurring automation ================= */
function runRecurring(){
  let made=0;const now=today();const saveCur=DB.current;
  Object.values(DB.companies).forEach(co=>{
    DB.current=co.id;
    Object.values(co.recurring).forEach(r=>{
      if(r.paused)return;let k=r.last?addMonths(r.last,1):ym(r.start);
      for(let guard=0;guard<36;guard++){
        const day=Math.min(+r.day||1,+monthEnd(k).slice(8));const date=`${k}-${String(day).padStart(2,'0')}`;
        if(date>now||(r.end&&date>r.end))break;
        if(date>=r.start){
          const t=JSON.parse(JSON.stringify(r.tpl));const id=uid();
          if(r.kind==='IV'){const term=ct(t.contactId).term??co.org.term??30;co.docs[id]={...t,id,type:'IV',date,due:addDays(date,+term),no:nextNo('IV',date),auto:r.id};}
          else{const e={...t,id,date,auto:r.id};if(e.credit)e.due=addDays(date,+(ct(t.contactId).term??30));co.expenses[id]=e;}
          made++;REV++;
        }
        r.last=k;k=addMonths(k,1);
      }
    });
  });
  DB.current=saveCur;
  if(made){persist();setTimeout(()=>toast(`สร้างรายการประจำอัตโนมัติ ${made} รายการ`),400)}
}

function saveBank(code){
  const kind=code?(code.startsWith('111')?'cash':'bank'):$('#bk_kind').value;const name=val('bk_name')||(kind==='bank'?[val('bk_bank'),val('bk_no')].filter(Boolean).join(' '):'');
  if(!name)return toast('กรุณาใส่ชื่อบัญชี');
  let c=code;if(!c){let k=kind==='bank'?1121:1111;while(C().accounts[String(k)])k++;c=String(k)}
  const a={...(C().accounts[c]||{}),code:c,name,type:'asset',money:1};
  if(kind==='bank')Object.assign(a,{bank:val('bk_bank')||'ธนาคาร',accType:$('#bk_type').value,accNo:val('bk_no'),accName:val('bk_accname'),bankBranch:val('bk_branch'),showOnDoc:$('#bk_show').checked});
  if(window._bklogo!==undefined){if(window._bklogo)a.logo=window._bklogo;else delete a.logo}
  C().accounts[c]=a;
  if(!code){const ob=r2(val('bk_open'));if(ob){const d=val('bk_odate')||today();const id=uid();C().journals[id]={id,date:d,no:nextNo('JV',d),desc:'ยอดยกมา '+name,lines:[{acc:c,dr:ob>0?ob:0,cr:ob<0?-ob:0},{acc:'3200',dr:ob<0?-ob:0,cr:ob>0?ob:0}]}}}
  persist();closeModal();render();toast('บันทึกบัญชีแล้ว');
}

/* ================= tax-id lookup (กรมสรรพากร) ================= */
function taxInput(p,v){return `<div style="display:flex;gap:6px"><input id="${p}_tax" maxlength="13" inputmode="numeric" value="${esc(v||'')}" placeholder="13 หลัก" oninput="this.value=this.value.replace(/\\D/g,'');if(this.value.length===13&&!this.dataset.done){this.dataset.done=1;taxLookup('${p}')}" style="flex:1">${window.bridge&&window.bridge.lookupTax?`<button type="button" class="btn sm" id="${p}_taxbtn" onclick="taxLookup('${p}')">🔍 ค้นหา</button>`:''}</div><div class="muted" id="${p}_taxmsg" style="font-size:12px;margin-top:3px"></div>`}
async function taxLookup(p){
  const tin=val(p+'_tax'),msg=$('#'+p+'_taxmsg');if(!window.bridge||!window.bridge.lookupTax)return;
  if(!/^\d{13}$/.test(tin)){msg.textContent='ใส่เลข 13 หลัก';return}
  msg.textContent='กำลังค้นหาจากกรมสรรพากร…';const btn=$('#'+p+'_taxbtn');if(btn)btn.disabled=true;
  let r;try{r=await window.bridge.lookupTax(tin)}catch(e){r={error:'ค้นหาไม่สำเร็จ'}}if(btn)btn.disabled=false;
  if(r.error){msg.innerHTML='<span style="color:var(--bad)">'+esc(r.error)+'</span>';return}

/* ================= attachments ================= */
const ATT={};let ATK=0;
function attBox(expr,live){const k='att'+(++ATK);ATT[k]={expr,live};return `<div class="att-wrap"><div class="att-h"><b>เอกสารแนบ</b> <span class="muted" id="${k}_n"></span><label class="btn sm" style="cursor:pointer;margin-left:auto">📎 แนบไฟล์<input type="file" multiple style="display:none" onchange="attAdd('${k}',this.files);this.value=''"></label></div><div id="${k}" class="att-list">${attItems(k)}</div></div>`}
function attObj(k){try{return (0,eval)(ATT[k].expr)}catch(e){return null}}
function attItems(k){const o=attObj(k)||{};const fs=o.files||[];setTimeout(()=>{const n=$('#'+k+'_n');if(n)n.textContent=fs.length?'('+fs.length+')':''},0);
  return fs.length?fs.map((f,i)=>`<div class="att-it"><span class="att-ic">${/pdf/i.test(f.type||f.name)?'PDF':/image/i.test(f.type||'')?'IMG':/sheet|excel|xls/i.test(f.type+f.name)?'XLS':/word|doc/i.test(f.type+f.name)?'DOC':'FILE'}</span><a href="javascript:void 0" onclick="attOpen('${k}',${i})" title="เปิดไฟล์">${esc(f.name)}</a><span class="muted" style="font-size:12px">${f.size>1048576?(f.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(f.size/1024))+' KB'}</span>${window.bridge&&window.bridge.attachSaveAs?`<button class="btn sm" title="บันทึกไฟล์ออก" onclick="attSaveAs('${k}',${i})">⬇</button>`:''}<button class="btn sm danger" title="นำออก" onclick="attDel('${k}',${i})">✕</button></div>`).join(''):'<div class="muted" style="font-size:13px">ยังไม่มีไฟล์แนบ — แนบได้หลายไฟล์ เช่น PDF รูปถ่ายบิล สลิปโอนเงิน สัญญา</div>'}
function attRefresh(k){const e=$('#'+k);if(e)e.innerHTML=attItems(k)}
function b64OfBuf(buf){let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
async function attAdd(k,files){
  const o=attObj(k);if(!o)return;o.files=o.files||[];
  for(const f of [...files]){
    if(f.size>50*1048576){toast(f.name+' ใหญ่เกิน 50 MB');continue}
    const buf=await f.arrayBuffer();const b64=b64OfBuf(buf);
    if(window.bridge&&window.bridge.attachSave){const id=await window.bridge.attachSave(f.name,b64);o.files.push({id,name:f.name,size:f.size,type:f.type})}
    else{if(f.size>3*1048576){toast(f.name+' ใหญ่เกิน 3 MB (โหมดเบราว์เซอร์)');continue}o.files.push({id:uid(),name:f.name,size:f.size,type:f.type,data:'data:'+(f.type||'application/octet-stream')+';base64,'+b64})}
  }
  if(ATT[k].live){persist();render()}attRefresh(k);toast('แนบไฟล์แล้ว');
}
function attOpen(k,i){const f=(attObj(k).files||[])[i];if(!f)return;if(window.bridge&&window.bridge.attachOpen&&!f.data)window.bridge.attachOpen(f.id);else if(f.data){const a=document.createElement('a');a.href=f.data;a.download=f.name;a.target='_blank';document.body.appendChild(a);a.click();a.remove()}}
function attSaveAs(k,i){const f=(attObj(k).files||[])[i];if(f&&window.bridge)window.bridge.attachSaveAs(f.id,f.name).then(r=>{if(r)toast('บันทึกไฟล์แล้ว')})}
function attDel(k,i){const o=attObj(k);const f=o.files[i];askConfirmInline(`นำ "${esc(f.name)}" ออกจากเอกสารนี้?`,()=>{o.files.splice(i,1);if(ATT[k].live){persist();render()}attRefresh(k)})}
function askConfirmInline(msg,fn){if(window.confirm===undefined){fn();return}let ok=true;try{ok=window.confirm(msg.replace(/<[^>]+>/g,''))}catch(e){ok=true}if(ok)fn()}
const clip=o=>(o&&o.files&&o.files.length)?` <span class="muted" title="มีไฟล์แนบ ${o.files.length} ไฟล์">📎${o.files.length}</span>`:'';

function shrinkImg(f,max,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.82))};img.src=r.result};r.readAsDataURL(f)}

function saveDoc(force){

function saveNote(){

function openBilling(id,cid){

   <div class="full"><label>ลูกค้า *</label><select id="b_ct" onchange="draft.contactId=this.value;draft.invoices=[];drawBn()">${contactOptions(d.contactId,'customer').replace('<option value="__new">+ เพิ่มรายชื่อใหม่…</option>','')}</select></div>
   <div><label>วันที่วางบิล</label><input id="d_date" type="date" value="${d.date}"></div>

function drawBn(){
  const ivs=list('docs').filter(x=>x.type==='IV'&&x.contactId===draft.contactId&&live(x)&&(ivBalance(x)>0.005||draft.invoices.includes(x.id))).sort((a,b)=>a.date.localeCompare(b.date));
  $('#bnRows').innerHTML=!draft.contactId?'<div class="muted">เลือกลูกค้าก่อน</div>':ivs.length?`<table><tr><th></th><th>เลขที่</th><th>วันที่</th><th>ครบกำหนด</th><th class="num">ยอดรวม</th><th class="num">คงค้าง</th></tr>${ivs.map(iv=>`<tr><td><input type="checkbox" ${draft.invoices.includes(iv.id)?'checked':''} onchange="this.checked?draft.invoices.push('${iv.id}'):draft.invoices=draft.invoices.filter(x=>x!=='${iv.id}');bnSum()"></td><td>${esc(iv.no)}</td><td>${thDate(iv.date)}</td><td>${thDate(iv.due)}</td><td class="num">${money(ivTotal(iv))}</td><td class="num">${money(ivBalance(iv))}</td></tr>`).join('')}<tr class="tot"><td colspan="5">รวมยอดวางบิล</td><td class="num" id="bnTot"></td></tr></table>`:'<div class="muted">ลูกค้ารายนี้ไม่มีใบแจ้งหนี้ค้างชำระ</div>';
  bnSum();
}
function bnSum(){const e=$('#bnTot');if(e)e.textContent=money(draft.invoices.reduce((a,id)=>a+ivBalance(C().docs[id]),0))}
function saveBilling(){
  draft.extra=readExtra('BN');draft.contactId=$('#b_ct').value;draft.date=val('d_date');draft.due=val('d_due');draft.note=$('#d_note').value;const no=val('d_no');if(no)draft.no=no;
  if(!draft.contactId)return toast('กรุณาเลือกลูกค้า');if(!draft.invoices.length)return toast('กรุณาเลือกใบแจ้งหนี้อย่างน้อย 1 ใบ');
  const id=draft.id||uid();if(draft.no&&!draft.id)learnNo('BN',draft.no,draft.date);else if(!draft.no)draft.no=nextNo('BN',draft.date);const d={...draft};delete d.id;put('docs',id,d);closeModal();toast('บันทึก '+d.no+' แล้ว');viewDoc(id);
}

/* ================= receipts (credit collection) ================= */
let rdraft=null;
function vReceipts(){
  $('#topAct').innerHTML=`<button class="btn" onclick="openDeposit('rc')">+ รับเงินมัดจำ</button><button class="btn pri" onclick="openReceipt()">+ รับชำระเงิน</button>`;
  const f=UI.rc||(UI.rc={q:'',m:''});
  let rows=list('receipts').sort((a,b)=>b.date.localeCompare(a.date)||(b.no||'').localeCompare(a.no||''));
  if(f.m)rows=rows.filter(r=>ym(r.date)===f.m);
  if(f.q){const q=f.q.toLowerCase();rows=rows.filter(r=>(ctName(r.contactId)+' '+r.no+' '+(r.ref||'')+' '+(r.apply||[]).map(x=>(C().docs[x.docId]||{}).no).join(' ')).toLowerCase().includes(q))}
  return `<div class="toolbar"><input placeholder="ค้นหาลูกค้า / เลขที่" value="${esc(f.q)}" oninput="UI.rc.q=this.value;rerenderKeep(this)"><input type="month" value="${f.m}" onchange="UI.rc.m=this.value;render()"></div>
  <div class="tablewrap">${rows.length?`<table><tr><th>เลขที่</th><th>วันที่</th><th>ลูกค้า</th><th>ชำระใบแจ้งหนี้</th><th>เข้าบัญชี</th><th class="num">ยอดชำระ</th><th class="num">ถูกหัก ณ ที่จ่าย</th><th class="num">รับจริง</th><th></th></tr>
  ${rows.map(r=>{const c=rcCalc(r);return `<tr class="click" onclick="viewReceipt('${r.id}')"><td>${esc(r.no)}${clip(r)}</td><td>${thDate(r.date)}</td><td>${esc(ctName(r.contactId))}</td><td class="muted">${r.dep?`<span class="tag" style="background:#E8F5E9;color:#15803D">มัดจำ</span> ${esc((C().docs[r.dep.refId]||{}).no||'')} · คงเหลือ ${money(depLeft({...r,id:r.id},'receipts'))}`:(r.apply||[]).map(x=>esc((C().docs[x.docId]||{}).no||'?')).join(', ')}</td><td>${esc(A(r.acc).name)}</td><td class="num">${money(c.gross)}</td><td class="num">${c.wht?money(c.wht):'-'}</td><td class="num">${money(c.net)}</td><td>${r.status==='void'?tag('void'):''}</td></tr>`}).join('')}</table>`:'<div class="empty">ยังไม่มีการรับชำระ</div>'}</div>`;
}
function openReceipt(id,cid,docId){
  if(id&&C().receipts[id]&&C().receipts[id].dep)return openDeposit('rc',id);
  if(id)rdraft=JSON.parse(JSON.stringify(C().receipts[id]));
  else{rdraft={date:today(),contactId:cid||'',acc:'1120',wht:0,ref:'',apply:[],note:(C().org.notes||{}).RE||''};if(docId){const iv=C().docs[docId];rdraft.contactId=iv.contactId;rdraft.apply=[{docId,amt:ivBalance(iv)}]}}
  openModal(`<h2>${id?'แก้ไขใบเสร็จ '+esc(rdraft.no):'รับชำระเงิน'}</h2><div class="f">
   <div class="full"><label>ลูกค้า *</label><select id="r_ct" onchange="rdraft.contactId=this.value;rdraft.apply=[];drawRc()">${contactOptions(rdraft.contactId,'customer').replace('<option value="__new">+ เพิ่มรายชื่อใหม่…</option>','')}</select></div>
   <div><label>วันที่รับเงิน</label><input id="r_date" type="date" value="${rdraft.date}"></div>
   <div><label>รับเข้าบัญชี</label><select id="r_acc">${moneyOptions(rdraft.acc)}</select></div>
   <div><label>ลูกค้าหักภาษี ณ ที่จ่าย</label><select id="r_wht" onchange="rdraft.wht=+this.value;rcSum()">${WHT.map(([v,t])=>`<option value="${v}" ${+rdraft.wht===v?'selected':''}>${t}</option>`).join('')}</select></div>
   <div><label>อ้างอิง (เลขสลิป / เช็ค)</label><input id="r_ref" value="${esc(rdraft.ref||'')}"></div>
   <div><label>เลขที่ใบเสร็จ</label><input id="r_no" value="${esc(rdraft.no||'')}" placeholder="อัตโนมัติ"></div>
   <div class="full"><label>รูปแบบเอกสาร</label><select id="r_form">${[['','อัตโนมัติ (ออกใบกำกับภาษีให้เมื่อเป็นค่าบริการที่ยังไม่ได้ออกใบกำกับ)'],['RC','ใบเสร็จรับเงิน'],['RC_TX','ใบเสร็จรับเงิน / ใบกำกับภาษี']].filter(o=>o[0]!=='RC_TX'||C().org.vatReg).map(([v,n])=>`<option value="${v}" ${(rdraft.form||'')===v?'selected':''}>${n}</option>`).join('')}</select></div>
  </div>${extraInputs('RE',rdraft.extra)}<h3 style="margin:14px 0 6px;font-size:14px">ใบแจ้งหนี้ที่รับชำระ (แก้จำนวนเพื่อรับชำระบางส่วน)</h3><div id="rcRows"></div><div id="rcSum" style="margin-top:10px;text-align:right"></div>
  <div class="f" style="margin-top:10px"><div class="full">${noteField(rdraft.note)}</div></div>
  ${attBox('rdraft')}
  <div class="acts"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn ok" onclick="saveReceipt()">บันทึกใบเสร็จ</button></div>`,true);
  drawRc();
}
function drawRc(){
  const cid=rdraft.contactId;const mine=rdraft.id?(C().receipts[rdraft.id].apply||[]):[];
  const ivs=list('docs').filter(d=>d.type==='IV'&&d.contactId===cid&&live(d)).map(d=>({d,bal:r2(ivBalance(d)+(mine.find(x=>x.docId===d.id)||{amt:0}).amt)})).filter(x=>x.bal>0.005||rdraft.apply.some(a=>a.docId===x.d.id)).sort((a,b)=>a.d.date.localeCompare(b.d.date));
  $('#rcRows').innerHTML=!cid?'<div class="muted">เลือกลูกค้าก่อน</div>':ivs.length?`<table><tr><th></th><th>ใบแจ้งหนี้</th><th>วันที่</th><th>ครบกำหนด</th><th class="num">คงค้าง</th><th class="num">ชำระครั้งนี้</th></tr>${ivs.map(({d,bal})=>{const a=rdraft.apply.find(x=>x.docId===d.id);return `<tr><td><input type="checkbox" ${a?'checked':''} onchange="rcToggle('${d.id}',${bal},this.checked)"></td><td>${esc(d.no)}</td><td>${thDate(d.date)}</td><td>${thDate(d.due)}</td><td class="num">${money(bal)}</td><td class="num"><input type="number" step="0.01" min="0" max="${bal}" value="${a?a.amt:''}" ${a?'':'disabled'} id="ra_${d.id}" style="width:130px;text-align:right;padding:5px 8px;border:1px solid var(--line);border-radius:7px" oninput="rcAmt('${d.id}',this.value)"></td></tr>`}).join('')}</table>`:'<div class="muted">ไม่มีใบแจ้งหนี้ค้างชำระ</div>';
  rcSum();
}
function rcToggle(id,bal,on){if(on)rdraft.apply.push({docId:id,amt:bal});else rdraft.apply=rdraft.apply.filter(x=>x.docId!==id);const i=$('#ra_'+id);i.disabled=!on;i.value=on?bal:'';rcSum()}
function rcAmt(id,v){const a=rdraft.apply.find(x=>x.docId===id);if(a)a.amt=r2(v);rcSum()}
function rcSum(){const c=rcCalc(rdraft);$('#rcSum').innerHTML=`ยอดชำระ ${money(c.gross)}${c.wht?` · ถูกหัก ณ ที่จ่าย ${money(c.wht)}`:''} · <b style="font-size:17px">รับเงินจริง ฿${money(c.net)}</b>`}
function saveReceipt(){
  Object.assign(rdraft,{contactId:$('#r_ct').value,date:val('r_date'),acc:$('#r_acc').value,wht:+$('#r_wht').value,ref:val('r_ref'),note:$('#d_note').value,extra:readExtra('RE'),form:$('#r_form').value});const no=val('r_no');if(no)rdraft.no=no;
  rdraft.apply=rdraft.apply.filter(x=>x.amt>0);
  if(!rdraft.contactId)return toast('กรุณาเลือกลูกค้า');if(!rdraft.apply.length)return toast('กรุณาเลือกใบแจ้งหนี้และจำนวนเงิน');
  const mine=rdraft.id?(C().receipts[rdraft.id].apply||[]):[];
  for(const a of rdraft.apply){const iv=C().docs[a.docId];const bal=r2(ivBalance(iv)+(mine.find(x=>x.docId===a.docId)||{amt:0}).amt);if(a.amt>bal+0.005)return toast(`${iv.no} ชำระเกินยอดคงค้าง (${money(bal)})`)}
  if(rdraft.form==='RC_TX'&&rdraft.apply.some(a=>{const iv=C().docs[a.docId];return iv&&iv.taxPoint==='invoice'&&iv.vat&&(iv.parts||[]).includes('TX')}))toast('หมายเหตุ: ใบแจ้งหนี้บางใบออกใบกำกับภาษีไปแล้ว ระวังออกซ้ำ');
  const id=rdraft.id||uid();if(rdraft.no&&!rdraft.id)learnNo('RE',rdraft.no,rdraft.date);else if(!rdraft.no)rdraft.no=nextNo('RE',rdraft.date);const r={...rdraft};delete r.id;put('receipts',id,r);closeModal();toast('ออกใบเสร็จ '+r.no+' แล้ว');viewReceipt(id);
}

function drawDepRef(){const rc=ddraft._kind==='rc',cid=ddraft.contactId;
  const docs=list('docs').filter(d=>d.type===(rc?'QT':'PO')&&live(d)&&(!cid||d.contactId===cid)).sort((a,b)=>b.date.localeCompare(a.date));
  $('#p_ref').innerHTML=`<option value="">— ไม่อ้างอิง —</option>`+docs.map(d=>`<option value="${d.id}" ${ddraft.dep.refId===d.id?'selected':''}>${esc(d.no)} · ${thDate(d.date)}${d.range?'':' · ฿'+money(calcDoc(d).base)+' (ก่อน VAT)'}</option>`).join('');depPctBtns()}
function depPctBtns(){const r=C().docs[ddraft.dep.refId];const el=$('#p_pct');if(!el)return;
  if(!r||r.range){el.innerHTML='';depSum();return}const b=calcDoc(r).base;
  el.innerHTML=[10,20,30,50,100].map(p=>`<button type="button" class="btn sm" onclick="$('#p_base').value=${r2(b*p/100)};${!$('#p_desc').value?`$('#p_desc').value='มัดจำ ${p}% ตาม${ddraft._kind==='rc'?'ใบเสนอราคา':'ใบสั่งซื้อ'} ${esc(r.no)}';`:''}depSum()">${p}%</button>`).join('');depSum()}
function depSum(){const b=r2(+val('p_base')||0),vat=$('#p_vat').checked?r2(b*VAT):0,w=r2(b*(+$('#p_wht').value||0)/100);
  $('#p_sum').innerHTML=`มัดจำ ${money(b)}${vat?` + VAT ${money(vat)}`:''} = ${money(b+vat)}${w?` · หัก ณ ที่จ่าย ${money(w)}`:''} · <b style="font-size:17px">${ddraft._kind==='rc'?'รับเงินจริง':'จ่ายจริง'} ฿${money(b+vat-w)}</b>`}
function saveDeposit(kind){
  const rc=kind==='rc',coll=rc?'receipts':'payments';
  Object.assign(ddraft,{contactId:$('#p_ct').value,date:val('p_date'),acc:$('#p_acc').value,wht:+$('#p_wht').value,ref:val('p_refno'),note:$('#d_note').value});
  ddraft.dep={...ddraft.dep,base:r2(+val('p_base')||0),vat:$('#p_vat').checked,refId:$('#p_ref').value,desc:val('p_desc')};if(!rc)ddraft.dep.taxInv=val('p_tinv');
  const no=val('p_no');if(no)ddraft.no=no;
  if(!ddraft.contactId)return toast(rc?'กรุณาเลือกลูกค้า':'กรุณาเลือกผู้ขาย');if(!(ddraft.dep.base>0))return toast('กรุณาใส่จำนวนเงินมัดจำ');
  if(ddraft.id){const u=depUsed(ddraft.id,coll);if(ddraft.dep.base<u-0.005)return toast('มัดจำนี้ถูกหักไปแล้ว '+money(u)+' บาท ใส่จำนวนต่ำกว่านี้ไม่ได้')}
  const P=rc?'RE':'PV';const id=ddraft.id||uid();if(ddraft.no&&!ddraft.id)learnNo(P,ddraft.no,ddraft.date);else if(!ddraft.no)ddraft.no=nextNo(P,ddraft.date);
  if(rc&&!ddraft.form)ddraft.form=ddraft.dep.vat?'RC_TX':'RC';
  const isNew=!ddraft.id;const s={...ddraft};delete s.id;delete s._kind;s.apply=[];put(coll,id,s);closeModal();toast((rc?'รับ':'จ่าย')+'เงินมัดจำ '+s.no+' แล้ว');rc?viewReceipt(id):viewPayment(id);
  /* มีใบแจ้งหนี้ที่ออกจากใบเสนอราคานี้อยู่แล้ว → ถามว่าจะหักมัดจำในใบนั้นเลยไหม */
  if(rc&&isNew){const q=s.dep.refId&&C().docs[s.dep.refId];const ivs=q?list('docs').filter(x=>x.type==='IV'&&live(x)&&x.fromQT===q.no&&x.contactId===s.contactId&&status(x)!=='paid'):[];
    if(ivs.length===1)setTimeout(()=>askConfirm('หักเงินมัดจำในใบแจ้งหนี้',`ใบแจ้งหนี้ <b>${esc(ivs[0].no)}</b> ออกจากใบเสนอราคา ${esc(q.no)} ไว้แล้ว<br>ต้องการหักเงินมัดจำ ${esc(s.no)} ในใบแจ้งหนี้นั้นเลยไหม? ยอดค้างชำระจะลดลงตามมัดจำ`,'หักเงินมัดจำ',()=>{closeModal();applyDepToIv(ivs[0].id)}),300)}
}
/* ส่วนหักมัดจำในฟอร์มใบแจ้งหนี้ (coll='receipts') / บิลซื้อเชื่อ (coll='payments') */
function depPickHtml(x,coll){const cid=x.contactId;if(!cid)return '';
  const rows=depList(coll,cid,x.id).filter(o=>o.left>0.005||(x.deps||[]).some(d=>d.id===o.s.id));if(!rows.length)return '';
  return `<div class="card" style="margin-top:12px;padding:12px 14px;background:#F6FAF6;border-color:#CDE7CF"><b>หักเงินมัดจำ</b> <span class="muted" style="font-size:12.5px">${coll==='receipts'?'ลูกค้ารายนี้มีเงินมัดจำที่ยังไม่ได้หัก':'มีเงินมัดจำที่จ่ายให้ผู้ขายรายนี้ยังไม่ได้หัก'}</span>
   <table style="margin-top:6px"><tr><th></th><th>เลขที่</th><th>วันที่</th><th>รายละเอียด</th><th class="num">คงเหลือ (ก่อน VAT)</th><th class="num">หักครั้งนี้</th></tr>${rows.map(({s,left})=>{const a=(x.deps||[]).find(d=>d.id===s.id);return `<tr><td><input type="checkbox" ${a?'checked':''} onchange="depToggle('${coll}','${s.id}',${left},this.checked)"></td><td>${esc(s.no)}</td><td>${thDate(s.date)}</td><td class="muted" style="font-size:12.5px">${esc(s.dep.desc||'')}${s.dep.vat?' · มี VAT':''}</td><td class="num">${money(left)}</td><td class="num"><input type="number" step="0.01" min="0" max="${left}" value="${a?a.amt:''}" ${a?'':'disabled'} id="dp_${s.id}" style="width:120px;text-align:right;padding:5px 8px;border:1px solid var(--line);border-radius:7px" oninput="depAmt('${coll}','${s.id}',this.value)"></td></tr>`}).join('')}</table></div>`}
/* เงินมัดจำของลูกค้าที่ยังหักได้กับใบแจ้งหนี้ใบนี้ (มัดจำที่อ้างใบเสนอราคาของใบนี้มาก่อน) */
function depRowsFor(iv){const q=iv.fromQT&&list('docs').find(x=>x.type==='QT'&&x.no===iv.fromQT);
  return depList('receipts',iv.contactId,iv.id).filter(o=>o.left>0.005&&!(iv.deps||[]).some(dp=>dp.id===o.s.id)).sort((a,b)=>((q&&b.s.dep.refId===q.id)-(q&&a.s.dep.refId===q.id))||String(a.s.date).localeCompare(String(b.s.date)))}
function depAvail(iv){return r2(depRowsFor(iv).reduce((a,o)=>a+o.left,0))}
function applyDepToIv(ivId,silent){const iv=C().docs[ivId];if(!iv)return;const c=calcDoc(iv);let room=r2(c.base-depDed(iv,'receipts').base);
  /* ไม่หักเกินยอดที่ยังค้าง (กรณีรับชำระบางส่วนไปแล้ว) */
  const paidBase=c.total>0?r2(rcApplied(ivId)*c.base/c.total):0;room=r2(Math.min(room,c.base-depDed(iv,'receipts').base-paidBase));
  const add=[];for(const o of depRowsFor(iv)){if(room<=0.005)break;const a=r2(Math.min(o.left,room));add.push({id:o.s.id,amt:a});room=r2(room-a)}
  if(!add.length){if(!silent)toast('ไม่มีเงินมัดจำที่หักได้');return false}
  put('docs',ivId,{...iv,deps:[...(iv.deps||[]),...add]});if(!silent){toast('หักเงินมัดจำ '+add.map(a=>C().receipts[a.id].no).join(', ')+' ใน '+iv.no+' แล้ว');viewDoc(ivId)}return true}
function depTarget(coll){return coll==='receipts'?draft:edraft}
function depToggle(coll,id,left,on){const x=depTarget(coll);x.deps=(x.deps||[]).filter(d=>d.id!==id);if(on)x.deps.push({id,amt:left});const i=$('#dp_'+id);i.disabled=!on;i.value=on?left:'';coll==='receipts'?calc():expCalc()}
function depAmt(coll,id,v){const x=depTarget(coll);const a=(x.deps||[]).find(d=>d.id===id);if(a)a.amt=r2(v);coll==='receipts'?calc():expCalc()}
function depCheck(x,coll,base){const lim=depList(coll,x.contactId,x.id);for(const d of (x.deps||[])){const o=lim.find(l=>l.s.id===d.id);if(!o)return 'ไม่พบเงินมัดจำที่เลือก';if(d.amt>o.left+0.005)return `หักมัดจำ ${o.s.no} เกินยอดคงเหลือ (${money(o.left)})`}
  if(depDed(x,coll).base>base+0.005)return 'หักมัดจำเกินมูลค่าเอกสาร';return ''}

  printFrame(receiptPrint(r),(r.status==='void'?tag('void'):'')+' '+fsel,acts,`C().receipts['${id}']`);

/* ================= expenses / purchases ================= */
function vExp(){
  $('#topAct').innerHTML=`<button class="btn pri" onclick="openExpense()">+ บันทึกค่าใช้จ่าย / ซื้อ</button>`;
  const f=UI.exp||(UI.exp={m:'',a:'',q:'',st:'all'});
  let rows=list('expenses').sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(f.m)rows=rows.filter(e=>ym(e.date)===f.m);if(f.a)rows=rows.filter(e=>e.acc===f.a);
  if(f.st!=='all')rows=rows.filter(e=>f.st==='credit'?(e.credit&&expStatus(e)!=='paid'):expStatus(e)===f.st);
  if(f.q){const q=f.q.toLowerCase();rows=rows.filter(e=>[e.desc,ctName(e.contactId),e.payee,e.taxInv,e.no].join(' ').toLowerCase().includes(q))}
  const used=[...new Set(list('expenses').map(e=>e.acc))];
  const s=rows.reduce((a,e)=>{const c=calcExp(e);a.b+=c.base;a.v+=c.vat;a.t+=c.total;a.o+=exBalance(e);return a},{b:0,v:0,t:0,o:0});
  return `<div class="toolbar"><input placeholder="ค้นหา" value="${esc(f.q)}" oninput="UI.exp.q=this.value;rerenderKeep(this)"><input type="month" value="${f.m}" onchange="UI.exp.m=this.value;render()">
  <select onchange="UI.exp.a=this.value;render()"><option value="">ทุกบัญชี</option>${used.sort().map(a=>`<option value="${a}" ${f.a===a?'selected':''}>${esc(accName(a))}</option>`).join('')}</select>
  <select onchange="UI.exp.st=this.value;render()"><option value="all">ทั้งหมด</option><option value="credit" ${f.st==='credit'?'selected':''}>ค้างจ่าย (ซื้อเชื่อ)</option><option value="over" ${f.st==='over'?'selected':''}>เกินกำหนด</option><option value="paid" ${f.st==='paid'?'selected':''}>จ่ายแล้ว</option></select></div>
  <div class="tablewrap">${rows.length?`<table><tr><th>วันที่</th><th>ผู้ขาย</th><th>รายละเอียด</th><th>บัญชี</th><th class="num">ก่อน VAT</th><th class="num">VAT</th><th class="num">รวม</th><th class="num">ค้างจ่าย</th><th>สถานะ</th></tr>
  ${rows.map(e=>{const c=calcExp(e),st=expStatus(e);return`<tr class="click" onclick="viewExpense('${e.id}')"><td>${thDate(e.date)}</td><td>${esc(e.contactId?ctName(e.contactId):(e.payee||'-'))}</td><td>${esc(e.desc||'-')}${clip(e)}${e.auto?' <span class="muted">⟳</span>':''}${e.taxInv?`<div class="muted" style="font-size:12px">${esc(e.taxInv)}</div>`:''}</td><td class="muted" style="font-size:13px">${esc(accName(e.acc))}</td><td class="num">${money(c.base)}</td><td class="num">${c.vat?money(c.vat):'-'}</td><td class="num">${money(c.total)}</td><td class="num">${e.credit&&st!=='paid'?money(exBalance(e)):'-'}</td><td>${e.credit?tag(st):'<span class="tag paid">จ่ายสด</span>'}</td></tr>`}).join('')}
  <tr class="tot"><td colspan="4">รวม ${rows.length} รายการ</td><td class="num">${money(s.b)}</td><td class="num">${money(s.v)}</td><td class="num">${money(s.t)}</td><td class="num">${money(s.o)}</td><td></td></tr></table>`:'<div class="empty">ไม่มีรายการ</div>'}</div>`;
}

   ${!id&&!e.auto?`<div class="chk full" style="padding-top:4px"><input type="checkbox" id="e_rec"><label for="e_rec" style="margin:0">⟳ บันทึกรายการนี้ซ้ำอัตโนมัติทุกเดือน (เช่น ค่าเช่า ค่าอินเทอร์เน็ต)</label></div>`:''}

function pickExpProd(v){const p=list('products').find(p=>p.name===v&&canBuy(p));if(!p)return;$('#e_acc').value=pExpAcc(p);edraft.acc=pExpAcc(p);if(!val('e_desc'))$('#e_desc').value=p.name;if(p.cost)$('#e_amt').value=p.cost;expAssetUI();expCalc()}
function expAssetUI(){const a=A($('#e_acc').value);$('#e_assetRow').style.display=a.type==='asset'&&a.contra?'':'none';if(a.life&&!edraft.life)$('#e_life').value=a.life}
function readExp(){const ctv=$('#e_ct').value;Object.assign(edraft,{date:val('e_date'),taxInv:val('e_inv'),contactId:ctv==='__new'?'':ctv,payee:val('e_payee'),acc:$('#e_acc').value,desc:val('e_desc'),amount:+val('e_amt')||'',vat:$('#e_vat').checked,wht:+$('#e_wht').value,credit:$('#e_credit').value==='1',payAcc:$('#e_payacc').value,due:val('e_due'),note:$('#d_note')?$('#d_note').value:edraft.note});const a=A(edraft.acc);if(a.type==='asset'&&a.contra)edraft.life=+val('e_life')||a.life||5;else delete edraft.life;return edraft}
function expCalc(){const cr=$('#e_credit').value==='1';$('#e_payRow').style.display=cr?'none':'';$('#e_dueRow').style.display=cr?'':'none';
  const ctv=$('#e_ct').value;if(edraft.contactId!==ctv&&ctv!=='__new'){edraft.contactId=ctv;edraft.deps=[]}
  const box=$('#e_depBox');if(box){const h=cr?depPickHtml(edraft,'payments'):'';if(box.dataset.k!==(cr+'|'+edraft.contactId)){box.innerHTML=h;box.dataset.k=cr+'|'+edraft.contactId}}
  const dd=cr?depDed(edraft,'payments'):{base:0,vat:0,gross:0};
  const c=calcExp({amount:+val('e_amt')||0,vat:$('#e_vat').checked,wht:+$('#e_wht').value});$('#e_sum').innerHTML=`รวม ${money(c.total)}${dd.gross?` · หักมัดจำ ${money(dd.gross)}`:''}${c.whtAmt?` · หัก ณ ที่จ่าย ${money(cr&&dd.base?r2((c.base-dd.base)*(+$('#e_wht').value||0)/100):c.whtAmt)}${cr?' (ตอนจ่าย)':''}`:''} · <b>${cr?'ตั้งเจ้าหนี้':'จ่ายจริง'} ฿${money(cr?r2(c.total-dd.gross):c.paid)}</b>`}
function saveExpense(){
  readExp();const e={...edraft};const id=e.id||uid();delete e.id;
  if(!e.date||!(e.amount>0))return toast('กรุณาใส่วันที่และจำนวนเงิน');
  if(e.wht&&!e.contactId)return toast('มีหัก ณ ที่จ่าย ต้องเลือกผู้ขายจากรายชื่อ (ใช้ออก 50 ทวิ และ ภ.ง.ด.)');
  if(e.credit&&!e.contactId)return toast('ซื้อเชื่อ ต้องเลือกผู้ขายจากรายชื่อ');
  if(!e.credit){delete e.due;delete e.deps}else{delete e.payAcc;e.deps=(e.deps||[]).filter(d=>d.amt>0);if(!e.deps.length)delete e.deps;else{const er=depCheck({...e,id:edraft.id},'payments',calcExp(e).base);if(er)return toast(er)}
    if(edraft.id&&pvApplied(edraft.id)>r2(calcExp(e).total-depDed(e,'payments').gross)+0.005)return toast('ยอดหลังหักมัดจำต่ำกว่าที่จ่ายชำระไปแล้ว')}
  if(!e.no)e.no=nextNo(e.credit?'PU':'EX',e.date);
  const rec=$('#e_rec')&&$('#e_rec').checked;const poId=e.poId;
  put('expenses',id,e);
  if(poId&&C().docs[poId]){C().docs[poId].status='received';persist()}
  if(rec){const rid=uid();const t={...e};['no','date','due','auto','taxInv','poId'].forEach(k=>delete t[k]);C().recurring[rid]={id:rid,kind:'EX',day:+e.date.slice(8),start:e.date,last:ym(e.date),tpl:t,name:e.desc||A(e.acc).name};C().expenses[id].auto=rid;persist()}
  closeModal();toast('บันทึกแล้ว'+(rec?' และตั้งเป็นรายการประจำเดือน':''));
}
function delExpense(id){if(pvApplied(id)>0)return toast('ลบไม่ได้ มีใบสำคัญจ่ายชำระบิลนี้แล้ว');askConfirm('ยืนยันการลบ','ลบรายการนี้? รายการบัญชีที่เกี่ยวข้องจะถูกลบด้วย','ลบ',()=>{closeModal();del('expenses',id)},true)}
function viewExpense(id){
  const e=C().expenses[id];REPRINT=()=>viewExpense(id);
  const pvs=list('payments').filter(p=>live(p)&&(p.apply||[]).some(a=>a.expId===id));
  let acts=`<button class="btn danger l" onclick="delExpense('${id}')">ลบ</button><button class="btn" onclick="openExpense('${id}')">แก้ไข</button>`;
  if(e.credit){acts+=pvs.map(p=>`<button class="btn" onclick="viewPayment('${p.id}')">${esc(p.no)}</button>`).join('');if(expStatus(e)!=='paid')acts+=`<button class="btn ok" onclick="openPayment(null,null,'${id}')">จ่ายชำระ</button>`;
    const c=calcExp(e);openModal(`<h2>${esc(e.desc||A(e.acc).name)}</h2><table>${[['เลขที่',e.no],['วันที่บิล',thDate(e.date)],['เลขที่ใบกำกับ',e.taxInv||'-'],['ผู้ขาย',ctName(e.contactId)],['บัญชี',accName(e.acc)],['ก่อน VAT',money(c.base)],['VAT',money(c.vat)],['ยอดรวม',money(c.total)],...(depDed(e,'payments').gross?[['หักเงินมัดจำ',money(depDed(e,'payments').gross)+' ('+(e.deps||[]).map(d=>(C().payments[d.id]||{}).no).join(', ')+')']]:[]),['หัก ณ ที่จ่าย (เมื่อจ่าย)',e.wht?e.wht+'%':'-'],['ครบกำหนด',thDate(e.due)],['จ่ายแล้ว',money(pvApplied(id))],['คงค้าง',money(exBalance(e))]].map(([a,b])=>`<tr><td class="muted">${a}</td><td>${esc(b)}</td></tr>`).join('')}</table><div style="margin-top:8px">${tag(expStatus(e))}</div><div class="acts">${acts}</div>${attBox(`C().expenses['${id}']`,true)}`);return}
  if(e.wht&&e.contactId)acts+=`<button class="btn" onclick="view50('ex','${id}')">50 ทวิ</button>`;
  printFrame(pvPrint(null,e),'<span class="tag paid">จ่ายสด</span>',acts,`C().expenses['${id}']`);
}

let pdraft=null;
function vPayments(){
  $('#topAct').innerHTML=`<button class="btn" onclick="openDeposit('pv')">+ จ่ายเงินมัดจำ</button><button class="btn pri" onclick="openPayment()">+ จ่ายชำระเจ้าหนี้</button>`;

  ${rows.map(p=>{const c=pvCalc(p);return`<tr class="click" onclick="viewPayment('${p.id}')"><td>${esc(p.no)}${p.dep?` <span class="tag" style="background:#E8F5E9;color:#15803D">มัดจำ</span>`:''}</td><td>${thDate(p.date)}</td><td>${esc(ctName(p.contactId))}${p.dep?`<div class="muted" style="font-size:12px">คงเหลือ ${money(depLeft(p,'payments'))}</div>`:''}</td><td>${esc(A(p.acc).name)}</td><td class="num">${money(c.gross)}</td><td class="num">${c.wht?money(c.wht):'-'}</td><td class="num">${money(c.net)}</td><td>${p.status==='void'?tag('void'):''}</td></tr>`}).join('')}</table>`:'<div class="empty">ยังไม่มีการจ่ายชำระเจ้าหนี้ — บันทึกค่าใช้จ่ายแบบ "ซื้อเชื่อ" ก่อน แล้วกลับมาจ่ายที่นี่</div>'}</div>`;

function openPayment(id,cid,expId){
  if(id&&C().payments[id]&&C().payments[id].dep)return openDeposit('pv',id);
  if(id)pdraft=JSON.parse(JSON.stringify(C().payments[id]));
  else{pdraft={date:today(),contactId:cid||'',acc:'1120',ref:'',apply:[],note:(C().org.notes||{}).PV||''};if(expId){const e=C().expenses[expId];pdraft.contactId=e.contactId;pdraft.apply=[{expId,amt:exBalance(e)}]}}
  const vendors=[...new Set(list('expenses').filter(e=>e.credit).map(e=>e.contactId))];
  openModal(`<h2>${id?'แก้ไขใบสำคัญจ่าย '+esc(pdraft.no):'จ่ายชำระเจ้าหนี้'}</h2><div class="f">
   <div class="full"><label>ผู้ขาย *</label><select id="v_ct" onchange="pdraft.contactId=this.value;pdraft.apply=[];drawPv()"><option value="">— เลือก —</option>${vendors.map(v=>`<option value="${v}" ${pdraft.contactId===v?'selected':''}>${esc(ctName(v))}</option>`).join('')}</select></div>
   <div><label>วันที่จ่าย</label><input id="v_date" type="date" value="${pdraft.date}"></div>
   <div><label>จ่ายจากบัญชี</label><select id="v_acc">${moneyOptions(pdraft.acc)}</select></div>
   <div><label>อ้างอิง (เลขเช็ค / สลิป)</label><input id="v_ref" value="${esc(pdraft.ref||'')}"></div>
   <div><label>เลขที่</label><input id="v_no" value="${esc(pdraft.no||'')}" placeholder="อัตโนมัติ"></div>
  </div>${extraInputs('PV',pdraft.extra)}<h3 style="margin:14px 0 6px;font-size:14px">บิลที่ค้างจ่าย</h3><div id="pvRows"></div><div id="pvSum" style="margin-top:10px;text-align:right"></div>
  <div class="f" style="margin-top:10px"><div class="full">${noteField(pdraft.note)}</div></div>
  ${attBox('pdraft')}
  <div class="acts"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn ok" onclick="savePayment()">บันทึกการจ่าย</button></div>`,true);
  drawPv();
}
function drawPv(){
  const cid=pdraft.contactId;const mine=pdraft.id?(C().payments[pdraft.id].apply||[]):[];
  const bills=list('expenses').filter(e=>e.credit&&e.contactId===cid).map(e=>({e,bal:r2(exBalance(e)+(mine.find(x=>x.expId===e.id)||{amt:0}).amt)})).filter(x=>x.bal>0.005||pdraft.apply.some(a=>a.expId===x.e.id)).sort((a,b)=>a.e.date.localeCompare(b.e.date));

function pvToggle(id,bal,on){if(on)pdraft.apply.push({expId:id,amt:bal});else pdraft.apply=pdraft.apply.filter(x=>x.expId!==id);const i=$('#pa_'+id);i.disabled=!on;i.value=on?bal:'';pvSum()}

function savePayment(){
  Object.assign(pdraft,{contactId:$('#v_ct').value,date:val('v_date'),acc:$('#v_acc').value,ref:val('v_ref'),note:$('#d_note').value,extra:readExtra('PV')});const no=val('v_no');if(no)pdraft.no=no;

  for(const a of pdraft.apply){const e=C().expenses[a.expId];const bal=r2(exBalance(e)+(mine.find(x=>x.expId===a.expId)||{amt:0}).amt);if(a.amt>bal+0.005)return toast('จ่ายเกินยอดคงค้าง ('+money(bal)+')')}

function viewPayment(id){

  const acts=p.status==='void'?`<button class="btn danger l" onclick="askConfirm('ลบถาวร','ลบ ${esc(p.no)} ถาวร?','ลบ',()=>{closeModal();del('payments','${id}')},true)">ลบถาวร</button><button class="btn" onclick="C().payments['${id}'].status='';persist();render();viewPayment('${id}')">กู้คืน</button>`:
   `<button class="btn danger l" onclick="if(C().payments['${id}'].dep&&depUsed('${id}','payments')>0)return toast('ยกเลิกไม่ได้ มัดจำนี้ถูกหักในบิลซื้อแล้ว');C().payments['${id}'].status='void';persist();render();viewPayment('${id}')">ยกเลิก</button><button class="btn" onclick="openPayment('${id}')">แก้ไข</button>${c.wht?`<button class="btn" onclick="view50('pv','${id}')">50 ทวิ</button>`:''}`;

function view50(kind,id){
  REPRINT=()=>view50(kind,id);
  if(kind==='ex'){const e=C().expenses[id];printFrame(wht50Print([whtItemsFromExp(e)],ct(e.contactId),e.date,e.no),'',`<button class="btn l" onclick="viewExpense('${id}')">← กลับ</button>`)}

  else{const p=C().payments[id];const items=(p.apply||[]).map(a=>{const e=C().expenses[a.expId];return e&&+e.wht?whtItemsFromExp(e,a.amt):null}).filter(Boolean);printFrame(wht50Print(items,ct(p.contactId),p.date,p.no),'',`<button class="btn l" onclick="viewPayment('${id}')">← กลับ</button>`)}

function vJournals(){

function openJV(id,preset){

  <table class="items" style="margin-top:12px"><tr><th>บัญชี</th><th class="num" style="width:150px">เดบิต</th><th class="num" style="width:150px">เครดิต</th><th></th></tr><tbody id="jRows"></tbody></table>

function drawJ(){
  $('#jRows').innerHTML=jdraft.lines.map((l,k)=>`<tr><td><select onchange="jdraft.lines[${k}].acc=this.value" style="width:100%;padding:6px;border:1px solid var(--line);border-radius:7px"><option value="">— เลือกบัญชี —</option>${accOptions(l.acc)}</select></td>
   <td><input type="number" min="0" step="0.01" value="${l.dr||''}" style="text-align:right" oninput="jdraft.lines[${k}].dr=+this.value;jSum()"></td><td><input type="number" min="0" step="0.01" value="${l.cr||''}" style="text-align:right" oninput="jdraft.lines[${k}].cr=+this.value;jSum()"></td>
   <td>${jdraft.lines.length>2?`<button class="btn sm danger" onclick="jdraft.lines.splice(${k},1);drawJ()">✕</button>`:''}</td></tr>`).join('');jSum();

function jSum(){const d=r2(jdraft.lines.reduce((a,l)=>a+(+l.dr||0),0)),c=r2(jdraft.lines.reduce((a,l)=>a+(+l.cr||0),0));$('#jSum').innerHTML=`เดบิต <b>${money(d)}</b> · เครดิต <b>${money(c)}</b> ${d===c?'<span class="tag paid">สมดุล</span>':`<span class="tag over">ต่าง ${money(Math.abs(d-c))}</span>`}`}
function saveJV(){
  jdraft.date=val('j_date');jdraft.desc=val('j_desc');const no=val('j_no');if(no)jdraft.no=no;

  if(!jdraft.desc)return toast('กรุณาใส่คำอธิบาย');if(lines.length<2)return toast('ต้องมีอย่างน้อย 2 บรรทัด');
  const d=r2(lines.reduce((a,l)=>a+l.dr,0)),c=r2(lines.reduce((a,l)=>a+l.cr,0));if(d!==c)return toast('ยอดเดบิตและเครดิตต้องเท่ากัน');
