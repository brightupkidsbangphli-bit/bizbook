function taxData(from,to){
  const inP=d=>d>=from&&d<=to;const out=[],inp=[],wht=[],whr=[];
  list('docs').filter(d=>live(d)&&d.vat).forEach(d=>{
    if(d.type==='IV'&&d.taxPoint==='invoice'&&inP(d.date)){const c=calcDoc(d),dd=depDed(d,'receipts');const vb=dd.vat?dd.base:0;out.push({date:d.date,no:d.no,ct:d.contactId,base:r2(c.base-vb),vat:r2(c.vat-dd.vat)})}
    if((d.type==='CN'||d.type==='DB')&&inP(d.date)){const iv=C().docs[d.refId]||{};if(iv.taxPoint==='invoice'){const c=calcDoc(d),s=d.type==='CN'?-1:1;out.push({date:d.date,no:d.no,ct:d.contactId,base:s*c.base,vat:s*c.vat})}}
  });
  list('receipts').filter(r=>live(r)&&inP(r.date)&&r.dep).forEach(r=>{const c=rcCalc(r);if(c.depVat)out.push({date:r.date,no:r.no,ct:r.contactId,base:c.base,vat:c.depVat,dep:1});if(c.wht)whr.push({date:r.date,no:r.no,ct:r.contactId,base:c.base,rate:r.wht,wht:c.wht})});
  list('receipts').filter(r=>live(r)&&inP(r.date)&&!r.dep).forEach(r=>{let b=0,v=0;(r.apply||[]).forEach(a=>{const iv=C().docs[a.docId];if(iv&&iv.vat&&iv.taxPoint!=='invoice'){const s=splitApplied(iv,a.amt);b+=s.base;v+=s.vat}});if(v)out.push({date:r.date,no:r.no,ct:r.contactId,base:r2(b),vat:r2(v)});
    const c=rcCalc(r);if(c.wht)whr.push({date:r.date,no:r.no,ct:r.contactId,base:c.base,rate:r.wht,wht:c.wht})});
  list('expenses').forEach(e=>{const c=calcExp(e),dd=e.credit?depDed(e,'payments'):{base:0,vat:0};if(e.vat&&inP(e.date))inp.push({date:e.date,no:e.taxInv||'',ct:e.contactId,payee:e.payee,base:r2(c.base-(dd.vat?dd.base:0)),vat:r2(c.vat-dd.vat)});
    if(+e.wht&&!e.credit&&inP(e.date))wht.push({date:e.date,ct:e.contactId,...whtItemsFromExp(e),ref:e.no})});
  list('payments').filter(p=>live(p)&&inP(p.date)&&p.dep).forEach(p=>{const c=pvCalc(p);if(c.vat)inp.push({date:p.date,no:p.dep.taxInv||p.no,ct:p.contactId,base:c.base,vat:c.vat,dep:1});if(c.wht)wht.push({date:p.date,ct:p.contactId,type:(WHT.find(w=>w[0]===+p.wht)||[,''])[1].replace(/^\d+% /,''),rate:+p.wht,desc:'เงินมัดจำ '+(p.dep.desc||''),base:c.base,wht:c.wht,ref:p.no})});
  list('payments').filter(p=>live(p)&&inP(p.date)&&!p.dep).forEach(p=>(p.apply||[]).forEach(a=>{const e=C().expenses[a.expId];if(e&&+e.wht)wht.push({date:p.date,ct:p.contactId,...whtItemsFromExp(e,a.amt),ref:p.no})}));
  const S=(a,k)=>r2(a.reduce((s,x)=>s+x[k],0));
  const pnd3=r2(wht.filter(w=>ct(w.ct).entity==='person').reduce((a,w)=>a+w.wht,0)),pnd53=r2(wht.filter(w=>ct(w.ct).entity!=='person').reduce((a,w)=>a+w.wht,0));
  return {out,inp,wht,whr,outV:S(out,'vat'),outB:S(out,'base'),inV:S(inp,'vat'),inB:S(inp,'base'),vatNet:r2(S(out,'vat')-S(inp,'vat')),pnd3,pnd53};
}

function sigUpload(f,kind){if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=kind==='stamp'?400:600;const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);
  const d=g.getImageData(0,0,c.width,c.height),px=d.data;for(let i=0;i<px.length;i+=4){const m=Math.min(px[i],px[i+1],px[i+2]);if(m>225)px[i+3]=0;else if(m>180)px[i+3]=Math.round(px[i+3]*(225-m)/45)}g.putImageData(d,0,0);
  // trim transparent edges
  let x0=c.width,y0=c.height,x1=0,y1=0;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(px[(y*c.width+x)*4+3]>20){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  let url;if(x1>x0&&y1>y0){const t=document.createElement('canvas');t.width=x1-x0+1;t.height=y1-y0+1;t.getContext('2d').putImageData(g.getImageData(x0,y0,t.width,t.height),0,0);url=t.toDataURL('image/png')}else url=c.toDataURL('image/png');
  const o=C().org;o.sigDefault=o.sigDefault||{};if(kind==='stamp'){if(!o.stamp)o.sigDefault.stamp=true;o.stamp=url}else{o.sigs=o.sigs||[];const nid=uid();o.sigs.push({id:nid,name:'',img:url});if(!o.sigDefault.id)o.sigDefault.id=nid}persist();toast(kind==='stamp'?'บันทึกตราประทับแล้ว':'เพิ่มลายเซ็นแล้ว — ใส่ชื่อผู้ลงนามและเลือกใช้ที่ช่องลงนาม');render()};img.src=r.result};r.readAsDataURL(f)}

  <div class="card" style="max-width:720px;margin-top:14px"><h3>สำรองและกู้คืนข้อมูล</h3>

  <div class="card" style="max-width:720px;margin-top:14px"><h3>รูปแบบเลขที่เอกสาร</h3>

   <table class="tbl" style="font-size:13px"><tr><th>ประเภท</th><th>รูปแบบ</th><th style="width:96px">เริ่มที่เลข</th><th>เลขถัดไป</th><th></th></tr>
   ${NUM_TYPES.map(([p,n])=>`<tr><td>${n}</td><td><input id="nf_${p}" value="${esc(numFmt(p))}" style="width:190px;font-family:monospace" oninput="numPrev('${p}')"></td><td><input id="ns_${p}" type="number" min="1" placeholder="อัตโนมัติ" style="width:88px" oninput="numPrev('${p}')"></td><td id="np_${p}" style="font-family:monospace;color:var(--pri);white-space:nowrap">${esc(nextNo(p,today()))}</td><td>${(C().org.numFmt||{})[p]?`<button class="btn sm" style="white-space:nowrap" onclick="numReset('${p}')">ค่าเริ่มต้น</button>`:''}</td></tr>`).join('')}</table>

}
function numPrev(p){const f=val('nf_'+p)||defNumFmt(p);const s=+val('ns_'+p);const [pre,post,pad]=expandFmt(f,today());const o=C().org;
  const keep=[o.numFmt,o.numStart];o.numFmt={...(o.numFmt||{}),[p]:f};o.numStart={...(o.numStart||{})};if(s>0)o.numStart[p]={key:pre+'|'+post,n:s};else delete o.numStart[p];
  $('#np_'+p).textContent=nextNo(p,today());[o.numFmt,o.numStart]=keep}
function saveNumFmt(){const o=C().org;o.numFmt={...(o.numFmt||{})};o.numStart={...(o.numStart||{})};
  for(const [p] of NUM_TYPES){const f=val('nf_'+p);if(f&&!/\{#+\}/.test(f))return toast('รูปแบบของ '+p+' ต้องมี {###} สำหรับเลขรัน');
    if(!f||f===defNumFmt(p))delete o.numFmt[p];else o.numFmt[p]=f;const s=+val('ns_'+p);if(s>0){const [pre,post]=expandFmt(numFmt(p),today());o.numStart[p]={key:pre+'|'+post,n:s}}}
  persist();render();toast('บันทึกรูปแบบเลขที่แล้ว')}
function numReset(p){const o=C().org;if(o.numFmt)delete o.numFmt[p];if(o.numStart)delete o.numStart[p];persist();render();toast('กลับไปใช้รูปแบบเริ่มต้นแล้ว')}
async function drawSync(){const el=$('#syncBox');if(!el)return;const L=await window.bridge.location();
  const fname=L.file.split(/[\\/]/).pop();
  el.innerHTML=`<p style="margin:0 0 10px;line-height:1.7">${L.local?'ตอนนี้ข้อมูลเก็บ<b>ในเครื่องนี้เท่านั้น</b> กด <b>บันทึกเป็นไฟล์ใช้ร่วมกัน</b> แล้วเลือกที่เก็บใน OneDrive (หรือ Google Drive / Dropbox) จากนั้นที่เครื่องอื่นกด <b>เปิดไฟล์ที่ใช้ร่วมกัน</b> แล้วเลือกไฟล์เดียวกัน ทุกเครื่องจะเห็นข้อมูลล่าสุดชุดเดียวกัน บันทึกอัตโนมัติทุกครั้งที่แก้ไข':`<span style="color:#16a34a;font-weight:600">● กำลังใช้ไฟล์ร่วมกัน</span> <b>${esc(fname)}</b><br><code style="font-size:12px;word-break:break-all">${esc(L.file)}</code><br>บันทึกอัตโนมัติทุกครั้งที่แก้ไข เปิดเครื่องไหนก็ได้ข้อมูลล่าสุด เมื่อมีการแก้ไขจากเครื่องอื่น หน้าจอจะอัปเดตให้เองภายในไม่กี่วินาที`}</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" onclick="shareSaveAs()">💾 บันทึกเป็นไฟล์ใช้ร่วมกัน…</button><button class="btn" onclick="shareOpen()">📂 เปิดไฟล์ที่ใช้ร่วมกัน…</button>
  ${L.local?'':`<button class="btn" onclick="moveData(null)">กลับไปเก็บในเครื่องนี้</button><button class="btn" onclick="syncNow().then(()=>toast('ซิงค์แล้ว'))">⟳ ซิงค์ตอนนี้</button>`}</div>
  ${L.onedrive?'':'<p style="margin:10px 0 0;font-size:12.5px">ไม่พบ OneDrive ในเครื่องนี้ ติดตั้งและลงชื่อเข้าใช้แอป OneDrive ก่อน เพื่อให้ไฟล์ซิงค์ระหว่างเครื่อง</p>'}
  <p style="margin:10px 0 0;font-size:12.5px">ไฟล์แนบจะเก็บในโฟลเดอร์ "${esc(fname.replace(/\.[^.]+$/,''))} ไฟล์แนบ" ข้างไฟล์ข้อมูล · ถ้าแก้ไขพร้อมกันสองเครื่อง ระบบจะรวมให้ทีละรายการ</p>`}
async function shareSaveAs(){const f=await window.bridge.pickSaveFile();if(f)moveData(f,'save')}
async function shareOpen(){const f=await window.bridge.pickOpenFile();if(f)moveData(f,'open')}
async function moveData(file,how){if(saveT){clearTimeout(saveT);saveT=null}
  const r=await window.bridge.setLocation(file,JSON.stringify(DB),how);
  if(r.error)return toast(r.error);if(r.cancel||r.same)return;
  toast(file==null?'ย้ายกลับมาเก็บในเครื่องนี้แล้ว':(how==='open'?'เปิดไฟล์ที่ใช้ร่วมกันแล้ว':'บันทึกเป็นไฟล์ใช้ร่วมกันแล้ว'));setTimeout(()=>location.reload(),600)}
function drawTpls(){const el=$('#ntpl');if(!el)return;const t=C().org.noteTpls||[];el.innerHTML=t.length?t.map((x,i)=>`<div style="display:grid;grid-template-columns:200px 1fr auto;gap:8px;margin-bottom:6px"><input class="nt-n" value="${esc(x.name)}" placeholder="ชื่อ เช่น เงื่อนไขชำระเงิน" style="padding:7px 10px;border:1px solid var(--line);border-radius:8px"><textarea class="nt-t" rows="4" style="min-height:100px;line-height:1.6;padding:7px 10px;border:1px solid var(--line);border-radius:8px">${esc(x.text)}</textarea><button class="btn sm danger" onclick="readTpls();C().org.noteTpls.splice(${i},1);drawTpls()">✕</button></div>`).join(''):'<div class="muted" style="font-size:13px">ยังไม่มี</div>'}
function readTpls(){const n=[...document.querySelectorAll('.nt-n')],t=[...document.querySelectorAll('.nt-t')];if(n.length||C().org.noteTpls)C().org.noteTpls=n.map((x,i)=>({name:x.value.trim()||t[i].value.trim().split('\n')[0].slice(0,40),text:t[i].value.trim()}))}
function saveOrg(){readTpls();const tpls=(C().org.noteTpls||[]).filter(x=>x.text);const o=readOrg(C().org);o.noteTpls=tpls;if(!o.name)return toast('กรุณาใส่ชื่อกิจการ');o.autoVat=$('#o_autovat').checked;o.notes={};['QT','IV','BN','RE','CN','PO','PV'].forEach(k=>o.notes[k]=$('#nt_'+k).value);C().org=o;persist();render();toast('บันทึกข้อมูลกิจการแล้ว')}
function copyNotesFrom(id){const src=DB.companies[id];if(!src)return;const so=src.org||{};const nt=(so.noteTpls||[]).length,nd=Object.values(so.notes||{}).filter(x=>x&&x.trim()).length;
  askConfirm('ใช้หมายเหตุแบบเดียวกัน',`คัดลอกหมายเหตุจาก <b>${esc(so.name)}</b> มาใช้กับ <b>${esc(C().org.name)}</b><br><br>• หมายเหตุสำเร็จรูป ${nt} รายการ<br>• หมายเหตุเริ่มต้นบนเอกสาร ${nd} ประเภท<br><br>หมายเหตุเดิมของกิจการนี้จะถูกแทนที่`,'คัดลอก',()=>{
    C().org.noteTpls=JSON.parse(JSON.stringify(so.noteTpls||[]));C().org.notes=JSON.parse(JSON.stringify(so.notes||{}));persist();closeModal();render();toast('คัดลอกหมายเหตุแล้ว')})}
function delCompany(){const o=C().org;askConfirm('ลบกิจการ',`ลบ "${esc(o.name)}" และข้อมูลทั้งหมด? กู้คืนได้จากไฟล์สำรองเท่านั้น<div class="f" style="margin-top:12px"><div class="full"><label>พิมพ์ชื่อกิจการเพื่อยืนยัน</label><input id="cf_name"></div></div>`,'ลบถาวร',()=>{if(val('cf_name')!==o.name)return toast('ชื่อไม่ตรง');delete DB.companies[DB.current];DB.current=Object.keys(DB.companies)[0];persist();closeModal();location.hash='dashboard';render();toast('ลบกิจการแล้ว')},true)}

/* ================= files ================= */
async function saveFile(name,data,mime){
  if(window.bridge){const r=await window.bridge.saveFile(name,data);if(r)toast('บันทึกไฟล์แล้ว');return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}
async function backup(){
  const ids=[];Object.values(DB.companies).forEach(c=>['docs','receipts','payments','expenses','journals'].forEach(k=>Object.values(c[k]||{}).forEach(o=>(o.files||[]).forEach(f=>{if(!f.data)ids.push(f.id)}))));
  let attachments={};if(ids.length&&window.bridge&&window.bridge.attachExport){toast('กำลังรวมไฟล์แนบ '+ids.length+' ไฟล์…');attachments=await window.bridge.attachExport(ids)}
  saveFile(`bizbook-backup-${today()}.json`,JSON.stringify({app:'bizbook',version:3,exportedAt:new Date().toISOString(),...DB,attachments}),'application/json')}
/* กู้คืน: รับได้ทั้งไฟล์ "สำรองข้อมูล", ไฟล์สำรองอัตโนมัติรายวัน และไฟล์ข้อมูลหลัก (bizbook-data.json / ไฟล์ใช้ร่วมกัน) */
function restore(file){
  if(!file)return;const r=new FileReader();r.onload=()=>restoreText(r.result,file.name);r.readAsText(file)}
function restoreText(text,name){
  let j;try{j=JSON.parse(text)}catch(e){return toast('ไฟล์ไม่ถูกต้อง หรือยังดาวน์โหลดจาก OneDrive ไม่ครบ')}
  if(!j||typeof j!=='object'||!j.companies||typeof j.companies!=='object')return toast('ไม่ใช่ไฟล์ข้อมูล BizBook');
  const cs=Object.values(j.companies);if(!cs.length)return toast('ไฟล์นี้ไม่มีข้อมูลกิจการ');
  const cnt=c=>['docs','receipts','expenses','payments','journals'].reduce((a,k)=>a+Object.keys(c[k]||{}).length,0);
  const when=j.exportedAt?thDate(j.exportedAt.slice(0,10)):(name&&/(\d{4}-\d{2}-\d{2})/.test(name)?thDate(name.match(/(\d{4}-\d{2}-\d{2})/)[1]):'');
  const cur=Object.values(DB.companies||{});
  askConfirm('กู้คืนข้อมูล',`${name?`ไฟล์ <b>${esc(name)}</b>`:'ไฟล์นี้'}${when?' ('+when+')':''} มี ${cs.length} กิจการ<br>${cs.map(c=>`• ${esc(c.org&&c.org.name||'-')} — ${cnt(c)} รายการ`).join('<br>')}<br><br>${cur.length?'<b>ข้อมูลที่เปิดอยู่ตอนนี้จะถูกแทนที่</b> (ยังมีสำเนาสำรองรายวันเก็บไว้)':'จะนำข้อมูลนี้มาใช้งาน'}`,'กู้คืน',async()=>{
    if(j.attachments&&window.bridge&&window.bridge.attachImport)await window.bridge.attachImport(j.attachments);
    DB={companies:j.companies,current:j.current};Object.values(DB.companies).forEach(migrate);if(!DB.companies[DB.current])DB.current=Object.keys(DB.companies)[0];
    persist();closeModal();location.hash='dashboard';render();toast('กู้คืนข้อมูลแล้ว')})}
async function restoreBackup(n){const t=await window.bridge.readBackup(n);if(!t)return toast('เปิดไฟล์สำรองไม่ได้');restoreText(t,n)}

window.addEventListener('hashchange',()=>{closeModal();render()});
load().then(()=>{runRecurring();render()});
</script>
<script>
/* BizBook มือถือ — เมนูแบบลิ้นชัก, สถานะ Google Drive, ย่อเอกสารให้พอดีจอ */
(function(){

const top=document.querySelector('.top');

/* สถานะไฟล์ Google Drive ท้ายเมนู */

  s.appendChild(d)};
if(window.C&&C())try{drawNav()}catch(e){}
/* ไม่เปิดคีย์บอร์ดเองทุกครั้งที่เปิดหน้าต่าง */
const om=window.openModal;window.openModal=function(){const r=om.apply(this,arguments);if(mob())setTimeout(()=>{const a=document.activeElement;if(a&&a!==document.body&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))a.blur()},60);fit();return r};
/* ย่อเอกสาร A4 ให้พอดีความกว้างจอ */
function fit(){requestAnimationFrame(()=>{document.querySelectorAll('#modal table.items').forEach(t=>{if(t.parentElement.classList.contains('itemsx'))return;const w=document.createElement('div');w.className='itemsx';t.parentElement.insertBefore(w,t);w.appendChild(t)});document.querySelectorAll('.pd').forEach(p=>{if(!mob()||document.body.classList.contains('printing')){p.style.zoom='';return}const w=(p.parentElement||p).clientWidth-4;p.style.zoom=Math.min(1,w/794).toFixed(3)})})}
new MutationObserver(fit).observe(document.getElementById('modal'),{childList:true,subtree:true});
addEventListener('resize',fit);
const dp=window.doPrint;window.doPrint=function(){document.querySelectorAll('.pd').forEach(p=>p.style.zoom='');dp.apply(this,arguments);setTimeout(fit,1500)};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();

</script>
</body>
